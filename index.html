<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTM Interview Assistant</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8fb;
      color: #163a4a;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    .app {
      width: min(1100px, 96vw);
      margin: 12px auto;
      padding: 12px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }
    h1 {
      text-align: center;
      color: #009EDB;
      margin: 0 0 6px;
      font-size: 26px;
    }
    .counter, .language {
      text-align: center;
      color: #5f6368;
      margin: 4px 0;
      font-size: 14px;
    }
    .question-row,
    .bottom-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      width: 100%;
    }
    .question-box,
    .question-info-box {
      background: #e8f4f9;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      padding: 14px 16px;
      line-height: 1.35;
      text-align: left;
      color: #21414f;
      white-space: pre-wrap;
      min-width: 0;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .question-box {
      flex: 1 1 0;
      min-height: 92px;
      font-size: 22px;
    }
    .question-box-label,
    .question-info-label {
      display: none;
    }
    .question-info-box {
      flex: 1 1 0;
      min-height: 92px;
      font-size: 20px;
      margin: 0;
      display: none;
    }
    .bottom-row {
      margin-top: 10px;
    }
    .bottom-row > .question-info-box {
      flex: 1 1 0;
      min-width: 0;
      margin: 0;
    }
    .answer-section {
      width: 100%;
      margin-top: 12px;
    }
    .answer-title {
      font-weight: bold;
      font-size: 15px;
      color: #4f6b78;
      margin: 0 0 5px;
    }
    .answer-box {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      background: #ffffff;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      color: #21414f;
      font-size: 18px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .answer-box:focus {
      border-color: #009EDB;
      box-shadow: 0 0 0 2px rgba(0, 158, 219, 0.12);
    }
    .answer-help {
      margin: -1px 0 7px;
      font-size: 12px;
      color: #6b8490;
    }
    /* Searchable multi-select dropdown for the spreadsheet's closed answers. */
    .answer-box.answer-box-dropdown {
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      overflow: visible;
    }
    .answer-dropdown {
      position: relative;
      width: 100%;
    }
    .answer-dropdown-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 54px;
      padding: 12px 14px;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      background: #fff;
      color: #21414f;
      font: inherit;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }
    .answer-dropdown-toggle:focus,
    .answer-search:focus {
      outline: 2px solid rgba(0, 158, 219, .3);
      outline-offset: 1px;
      border-color: #009EDB;
    }
    .answer-dropdown-label {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .answer-dropdown-chevron {
      flex: 0 0 auto;
      font-size: 18px;
      line-height: 1;
    }
    .answer-selected-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .answer-selected-summary:empty { display: none; }
    .answer-selected-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 5px 8px 5px 10px;
      border: 1px solid #a9d7e6;
      border-radius: 999px;
      background: #e8f4f9;
      color: #21414f;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .answer-selected-chip-text { min-width: 0; }
    .answer-selected-chip-remove {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #21414f;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    .answer-selected-chip-remove:hover { background: rgba(0, 158, 219, .13); }
    .answer-dropdown-panel {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(22, 58, 74, .12);
    }
    .answer-dropdown-panel[hidden] { display: none !important; }
    .answer-search {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid #b8d9e5;
      border-radius: 8px;
      background: #fff;
      color: #21414f;
      font: inherit;
    }
    .answer-wildcard-help {
      margin: 7px 1px;
      color: #607985;
      font-size: 12px;
      line-height: 1.4;
    }
    .answer-dropdown-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: min(36vh, 320px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 2px 2px 4px;
      -webkit-overflow-scrolling: touch;
    }
    .answer-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 11px;
      border: 1px solid #d3e7ee;
      border-radius: 8px;
      background: #f8fcfe;
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    .answer-option[hidden] { display: none !important; }
    .answer-option:hover {
      background: #eef9fd;
      border-color: #a9d7e6;
    }
    .answer-option input[type=checkbox] {
      width: 24px;
      height: 24px;
      margin: 1px 0 0;
      accent-color: #009EDB;
      flex: 0 0 auto;
      touch-action: manipulation;
    }
    .answer-option span {
      flex: 1 1 auto;
      min-width: 0;
    }
    .answer-no-results {
      padding: 12px 8px;
      color: #607985;
      font-size: 14px;
    }
    .answer-dropdown-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      padding-top: 9px;
      border-top: 1px solid #e2edf1;
    }
    .answer-match-count { color: #607985; font-size: 12px; }
    .answer-dropdown-actions { display: flex; gap: 8px; }
    .answer-dropdown-actions button {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid #b8d9e5;
      border-radius: 8px;
      background: #f5fbfd;
      color: #21414f;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .answer-dropdown-actions button:hover { background: #e8f4f9; }
    @media (max-width: 700px) {
      .answer-dropdown-toggle { min-height: 56px; }
      .answer-search { min-height: 50px; font-size: 16px; }
      .answer-dropdown-options { max-height: 34vh; }
      .answer-option { padding: 11px; }
    }
    .answer-textarea {
      width: 100%;
      min-height: 120px;
      border: 0;
      outline: none;
      resize: vertical;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: inherit;
    }
    .answer-save-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    #saveAnswerBtn {
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      background: #009EDB;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    #saveAnswerBtn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .question-audio-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    .question-audio-row button {
      width: auto;
      min-height: 48px;
      flex: 0 0 auto;
      padding: 11px 16px;
      font-size: 16px;
      touch-action: manipulation;
    }
    .question-audio-row .language {
      flex: 1;
      margin: 0;
    }
    #questionAudio {
      width: 100%;
      max-width: 700px;
      display: none;
      margin: 6px auto 0;
    }
    .action-row {
      display: flex;
      gap: 8px;
      width: 100%;
      margin: 8px 0;
    }
    .jump-question-control {
      flex: 1.2 1 0;
      min-width: 170px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid #d4dbe5;
      border-radius: 9px;
      background: #f8fafc;
    }
    .jump-question-control label {
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
    .jump-question-control input {
      flex: 1 1 70px;
      min-width: 0;
      width: 70px;
      margin: 0;
      min-height: 42px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .action-row .jump-question-control button {
      flex: 0 0 auto;
      width: auto;
      min-height: 42px;
      padding: 9px 14px;
      margin: 0;
    }
    .action-row button {
      flex: 1 1 0;
      width: auto;
      min-height: 50px;
      margin: 0;
      border: 0;
      border-radius: 9px;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    #startBtn { background: #009EDB; color: white; }
    #stopBtn { background: #5f93a8; color: white; }
    #nextBtn { background: #7fb6c8; color: white; }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      color: #315a6d;
      font-size: 16px;
      font-weight: bold;
      margin: 8px 0;
      min-height: 20px;
    }
    .live-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      width: 100%;
      margin-top: 2px;
    }
    .live-panel {
      flex: 1 1 0;
      min-width: 0;
    }
    .live-panel-label {
      font-weight: bold;
      font-size: 13px;
      color: #4f6b78;
      margin-bottom: 5px;
    }
    .live {
      background: #ffffff;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      min-height: 120px;
      padding: 14px;
      font-size: 18px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .live.translation-live {
      background: #eaf6fb;
      border-color: #b8d9e5;
    }
    .error {
      color: #d93025;
      white-space: pre-wrap;
      margin-top: 8px;
      font-size: 14px;
    }
    .saved {
      color: #188038;
      text-align: center;
      font-weight: bold;
      margin-top: 8px;
      font-size: 14px;
    }
    /* Tablet layout: keep Chinese + English side-by-side, stack the live panels,
       and enlarge controls for touch. */
    @media (max-width: 900px) {
      .app {
        width: 100%;
        margin: 0 auto;
        padding: 16px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .counter, .language {
        font-size: 16px;
      }

      .question-row {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        gap: 12px;
      }

      .question-box,
      .question-info-box {
        flex: 1 1 0;
        width: 0;
        min-width: 0;
        min-height: 96px;
        padding: 14px 16px;
        font-size: 22px;
        line-height: 1.35;
      }

      .question-info-box {
        font-size: 20px;
      }

      .live-row {
        flex-direction: column;
        gap: 12px;
      }

      .live {
        min-height: 150px;
        font-size: 19px;
      }

      .answer-box {
        min-height: 150px;
        font-size: 18px;
      }

      .answer-option {
        min-height: 50px;
        padding: 11px 12px;
        gap: 12px;
        font-size: 17px;
      }

      .status {
        font-size: 17px;
      }
    }

    @media (max-width: 560px) {
      .question-row,
      .bottom-row,
      .action-row {
        flex-direction: column;
      }

      .question-box,
      .question-info-box {
        width: 100%;
        min-height: 90px;
        font-size: 20px;
      }

      .question-info-box {
        font-size: 19px;
      }

      .action-row {
        gap: 8px;
      }

      .action-row button {
        width: 100%;
      }

      .jump-question-control {
        width: 100%;
        box-sizing: border-box;
      }
      .action-row .jump-question-control button {
        width: auto;
      }

      .question-audio-row {
        align-items: stretch;
        flex-direction: column;
      }

      .question-audio-row button {
        width: 100%;
      }

      .answer-save-row {
        justify-content: stretch;
      }

      #saveAnswerBtn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
<div class="app">
  <h1>🎤 DTM Interview Assistant</h1>

  <div id="counter" class="counter">Loading questions...</div>

  <div class="question-row">
    <div id="questionBox" class="question-box">
      <div id="question">Loading...</div>
    </div>
    <div id="sheetQuestion" class="question-info-box">
      <div id="sheetQuestionText"></div>
    </div>
  </div>

  <div id="language" class="language"></div>

  <div id="questionAudioWrap" style="display:none; margin: 8px 0 10px; text-align:center;">
    <div class="question-audio-row">
      <button id="playQuestionBtn" type="button" onclick="playQuestionAudio()">▶ Play Audio</button>
      <div id="audioStatus" class="language"></div>
    </div>
    <audio id="questionAudio" controls preload="none"></audio>
  </div>

  <div class="action-row">
    <button id="startBtn" onclick="startAnswer()">🎤 Start Answer</button>
    <button id="stopBtn" onclick="stopAnswer()" disabled>Stop &amp; Save</button>
    <button id="nextBtn" onclick="nextQuestion()">Next Question</button>
    <div class="jump-question-control">
      <label for="jumpQuestionNumber">Go to question ID (column A)</label>
      <input id="jumpQuestionNumber" type="text" inputmode="text" placeholder="Question ID" aria-label="Question ID from column A">
      <button id="jumpQuestionBtn" type="button" onclick="jumpToQuestion()">Go</button>
    </div>
  </div>

  <div id="status" class="status">Loading...</div>

  <div class="live-row">
    <div class="live-panel">
      <div class="live-panel-label">Live transcription</div>
      <div id="transcript" class="live">Press Start Answer and speak.</div>
    </div>
    <div class="live-panel">
      <div class="live-panel-label">Live English translation</div>
      <div id="liveEnglishTranslation" class="live translation-live">Waiting for speech...</div>
    </div>
  </div>

  <div id="saved" class="saved"></div>

  <div class="answer-section">
    <div class="answer-title">Answer</div>
    <div id="answerHelp" class="answer-help"></div>
    <div id="sheetAnswers" class="answer-box" aria-label="Answer"></div>
    <div class="answer-save-row">
      <button id="saveAnswerBtn" type="button" onclick="saveEditableAnswer()">Save Answer</button>
    </div>
  </div>

  <div id="error" class="error"></div>
</div>

<script>
  // Paste the Apps Script WEB APP URL here.
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzW2Z3pj0W_547wcpLKp_CkeKYodTnKO_sNjQ99-0UUrDdObJ5O3b4R1ZOq1cg5DedYdQ/exec';

  let questions = [];
  let currentIndex = 0;

  // One respondent session per browser tab/interview.
  // Apps Script uses this ID to keep all answers from this interview
  // in the same respondent column (H, I, J, ...).
  // One new respondent session for each fresh page load.
  // All answers in this interview use the same server-assigned column.
  const respondentSessionId =
    (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'session_' + Date.now() + '_' + Math.random().toString(36).slice(2);

  let ws = null;
  let mediaStream = null;

  let questionAudioUrl = null;
  let questionAudioRequestId = 0;
  let audioContext = null;
  let source = null;
  let processor = null;

  let finalTranscript = '';
  let interimTranscript = '';
  let isRecording = false;

  // Live English translation queue.
  // Only finalized Deepgram segments are translated so the English text
  // remains stable instead of changing on every interim result.
  let translationQueue = [];
  let translationBusy = false;
  let translationGeneration = 0;
  let translatedFinalSegments = [];
  let translationFlushTimer = null;

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  function setError(text) {
    document.getElementById('error').textContent = text || '';
  }


  function resetLiveEnglishTranslation(message) {
    translationGeneration++;
    if (translationFlushTimer) {
      clearTimeout(translationFlushTimer);
      translationFlushTimer = null;
    }
    translationQueue = [];
    translationBusy = false;
    translatedFinalSegments = [];

    const box = document.getElementById('liveEnglishTranslation');
    box.textContent = message || 'Waiting for speech...';
  }

  function normalizeLanguageCode(language) {
    const value = String(language || '').trim().toLowerCase();
    if (!value) return '';
    return value.split(/[-_]/)[0];
  }

  function appendLiveEnglishTranslation(text, generation) {
    if (generation !== translationGeneration) return;

    const value = String(text || '').trim();
    if (!value) return;

    translatedFinalSegments.push(value);

    document.getElementById('liveEnglishTranslation').textContent =
      translatedFinalSegments.join(' ');
  }

  function queueLiveEnglishTranslation(text, language) {
    const value = String(text || '').trim();
    if (!value) return;

    translationQueue.push({
      text: value,
      language: language,
      generation: translationGeneration
    });

    // Batch very short finalized segments together. This reduces the number
    // of Apps Script translation requests and makes timeouts much less likely.
    if (translationFlushTimer) clearTimeout(translationFlushTimer);
    translationFlushTimer = setTimeout(function() {
      translationFlushTimer = null;
      processLiveEnglishTranslationQueue();
    }, 350);
  }

  function processLiveEnglishTranslationQueue() {
    if (translationBusy || !translationQueue.length) return;

    const generation = translationGeneration;
    const batch = translationQueue.splice(0, translationQueue.length);
    const sourceLanguage = normalizeLanguageCode(batch[0].language);
    const combinedText = batch
      .map(function(item) { return item.text; })
      .join(' ');

    translationBusy = true;

    // English needs no translation.
    if (sourceLanguage === 'en') {
      appendLiveEnglishTranslation(combinedText, generation);
      translationBusy = false;
      if (translationQueue.length) processLiveEnglishTranslationQueue();
      return;
    }

    jsonpWithParams('translate', {
      text: combinedText,
      sourceLanguage: sourceLanguage
    }, {
      timeoutMs: 30000,
      timeoutMessage: 'Live translation request timed out.'
    })
      .then(function(data) {
        if (generation !== translationGeneration) return;

        const translated = String(data.translation || '').trim();

        if (translated) {
          appendLiveEnglishTranslation(translated, generation);
        } else if (!translatedFinalSegments.length) {
          document.getElementById('liveEnglishTranslation').textContent =
            'Translation unavailable.';
        }
      })
      .catch(function(err) {
        if (generation !== translationGeneration) return;

        document.getElementById('liveEnglishTranslation').textContent =
          translatedFinalSegments.length
            ? translatedFinalSegments.join(' ') + ' ' + '(translation delayed)'
            : 'Translation unavailable: ' + (err.message || String(err));
      })
      .finally(function() {
        translationBusy = false;
        if (translationQueue.length) processLiveEnglishTranslationQueue();
      });
  }

  function showQuestionSheetFields(q) {
    const questionBox = document.getElementById('sheetQuestion');
    const questionText = document.getElementById('sheetQuestionText');

    const questionValue = String(q.englishQuestion || '').trim();

    questionText.textContent = questionValue;
    questionBox.style.display = questionValue ? 'block' : 'none';
  }

  function parseClosedAnswerOptions(text) {
    return String(text || '')
      .split(/\||;|\n/)
      .map(function(value) { return value.trim(); })
      .filter(Boolean);
  }

  function renderAnswerBox(q, selectedValues) {
    const box = document.getElementById('sheetAnswers');
    const help = document.getElementById('answerHelp');
    const options = parseClosedAnswerOptions(q.closedAnswers);
    const selected = Array.isArray(selectedValues)
      ? selectedValues.map(function(value) { return String(value).trim(); })
      : [];

    box.innerHTML = '';

    if (options.length) {
      box.classList.add('answer-box-dropdown');
      help.textContent = 'Choose one or more responses. Search supports * and ? wildcards.';

      const dropdown = document.createElement('div');
      dropdown.className = 'answer-dropdown';

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'answer-dropdown-toggle';
      toggle.id = 'answerDropdownToggle';
      toggle.setAttribute('aria-haspopup', 'true');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-controls', 'answerDropdownPanel');
      toggle.onclick = toggleAnswerDropdown;

      const toggleLabel = document.createElement('span');
      toggleLabel.className = 'answer-dropdown-label';
      toggleLabel.id = 'answerDropdownLabel';
      toggleLabel.textContent = 'Choose answer choices';

      const chevron = document.createElement('span');
      chevron.className = 'answer-dropdown-chevron';
      chevron.setAttribute('aria-hidden', 'true');
      chevron.textContent = '▾';

      toggle.appendChild(toggleLabel);
      toggle.appendChild(chevron);

      const selectedSummary = document.createElement('div');
      selectedSummary.className = 'answer-selected-summary';
      selectedSummary.id = 'answerSelectedSummary';
      selectedSummary.setAttribute('aria-live', 'polite');

      const panel = document.createElement('div');
      panel.className = 'answer-dropdown-panel';
      panel.id = 'answerDropdownPanel';
      panel.hidden = true;

      const search = document.createElement('input');
      search.type = 'search';
      search.className = 'answer-search';
      search.id = 'answerChoiceSearch';
      search.placeholder = 'Search choices (e.g. *health*, educat*, c?t)...';
      search.setAttribute('aria-label', 'Search answer choices');
      search.autocomplete = 'off';
      search.oninput = filterAnswerOptions;

      const wildcardHelp = document.createElement('div');
      wildcardHelp.className = 'answer-wildcard-help';
      wildcardHelp.textContent = '* matches any number of characters; ? matches one character. Without wildcards, search finds text anywhere in a choice.';

      const list = document.createElement('div');
      list.className = 'answer-dropdown-options';
      list.id = 'answerDropdownOptions';
      list.setAttribute('role', 'group');
      list.setAttribute('aria-label', 'Available answer choices');

      options.forEach(function(option, index) {
        const label = document.createElement('label');
        label.className = 'answer-option';
        label.dataset.optionIndex = String(index);

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = option;
        checkbox.id = 'answerOption_' + index;
        checkbox.dataset.optionIndex = String(index);
        checkbox.checked = selected.indexOf(option) !== -1;
        checkbox.addEventListener('change', updateAnswerDropdownSummary);

        const span = document.createElement('span');
        span.textContent = option;

        label.appendChild(checkbox);
        label.appendChild(span);
        list.appendChild(label);
      });

      const noResults = document.createElement('div');
      noResults.className = 'answer-no-results';
      noResults.id = 'answerChoiceNoResults';
      noResults.textContent = 'No matching choices.';
      noResults.hidden = true;

      const footer = document.createElement('div');
      footer.className = 'answer-dropdown-footer';

      const matchCount = document.createElement('div');
      matchCount.className = 'answer-match-count';
      matchCount.id = 'answerChoiceMatchCount';

      const actions = document.createElement('div');
      actions.className = 'answer-dropdown-actions';

      const clearButton = document.createElement('button');
      clearButton.type = 'button';
      clearButton.textContent = 'Clear selected';
      clearButton.onclick = clearSelectedAnswerChoices;

      const doneButton = document.createElement('button');
      doneButton.type = 'button';
      doneButton.textContent = 'Done';
      doneButton.onclick = closeAnswerDropdown;

      actions.appendChild(clearButton);
      actions.appendChild(doneButton);
      footer.appendChild(matchCount);
      footer.appendChild(actions);

      panel.appendChild(search);
      panel.appendChild(wildcardHelp);
      panel.appendChild(list);
      panel.appendChild(noResults);
      panel.appendChild(footer);

      dropdown.appendChild(toggle);
      dropdown.appendChild(selectedSummary);
      dropdown.appendChild(panel);
      box.appendChild(dropdown);
      box.dataset.mode = 'dropdown';

      updateAnswerDropdownSummary();
      filterAnswerOptions();
      return;
    }

    box.classList.remove('answer-box-dropdown');
    help.textContent = 'Enter or edit the answer, then click Save Answer.';

    const textarea = document.createElement('textarea');
    textarea.className = 'answer-textarea';
    textarea.id = 'answerTextInput';
    textarea.placeholder = 'Type or edit the answer here...';
    textarea.value = selected.length ? selected.join('; ') : '';

    box.appendChild(textarea);
    box.dataset.mode = 'text';
  }

  function toggleAnswerDropdown() {
    const panel = document.getElementById('answerDropdownPanel');
    const toggle = document.getElementById('answerDropdownToggle');
    if (!panel || !toggle) return;

    const shouldOpen = panel.hidden;
    panel.hidden = !shouldOpen;
    toggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
    if (shouldOpen) {
      const search = document.getElementById('answerChoiceSearch');
      if (search) search.focus({ preventScroll: true });
    }
  }

  function closeAnswerDropdown() {
    const panel = document.getElementById('answerDropdownPanel');
    const toggle = document.getElementById('answerDropdownToggle');
    if (!panel || !toggle) return;
    panel.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
  }

  function normalizeAnswerSearchText(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLocaleLowerCase();
  }

  function answerOptionMatchesSearch(option, query) {
    const normalizedOption = normalizeAnswerSearchText(option);
    const normalizedQuery = normalizeAnswerSearchText(query).trim();
    if (!normalizedQuery) return true;

    // Without wildcard symbols, find the text anywhere in the answer choice.
    if (normalizedQuery.indexOf('*') === -1 && normalizedQuery.indexOf('?') === -1) {
      return normalizedOption.indexOf(normalizedQuery) !== -1;
    }

    // In wildcard mode, match the complete choice: * = any sequence; ? = one character.
    const pattern = Array.from(normalizedQuery).map(function(character) {
      if (character === '*') return '.*';
      if (character === '?') return '.';
      return character.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('');

    try {
      return new RegExp('^' + pattern + '$', 'i').test(normalizedOption);
    } catch (err) {
      return false;
    }
  }

  function filterAnswerOptions() {
    const box = document.getElementById('sheetAnswers');
    const search = document.getElementById('answerChoiceSearch');
    const list = document.getElementById('answerDropdownOptions');
    const noResults = document.getElementById('answerChoiceNoResults');
    const matchCount = document.getElementById('answerChoiceMatchCount');
    if (!box || box.dataset.mode !== 'dropdown' || !search || !list) return;

    const query = search.value || '';
    const optionRows = Array.from(list.querySelectorAll('.answer-option'));
    let visibleCount = 0;

    optionRows.forEach(function(row) {
      const checkbox = row.querySelector('input[type="checkbox"]');
      const matched = answerOptionMatchesSearch(checkbox ? checkbox.value : '', query);
      row.hidden = !matched;
      if (matched) visibleCount++;
    });

    if (noResults) noResults.hidden = visibleCount !== 0;
    if (matchCount) matchCount.textContent = visibleCount + ' of ' + optionRows.length + ' choices shown';
  }

  function updateAnswerDropdownSummary() {
    const box = document.getElementById('sheetAnswers');
    if (!box || box.dataset.mode !== 'dropdown') return;

    const toggleLabel = document.getElementById('answerDropdownLabel');
    const summary = document.getElementById('answerSelectedSummary');
    const selected = Array.from(
      box.querySelectorAll('#answerDropdownOptions input[type="checkbox"]:checked')
    ).map(function(input) { return String(input.value || '').trim(); }).filter(Boolean);

    if (toggleLabel) {
      toggleLabel.textContent = selected.length
        ? selected.length + ' answer choice' + (selected.length === 1 ? '' : 's') + ' selected — edit choices'
        : 'Choose answer choices';
    }

    if (!summary) return;
    summary.innerHTML = '';

    selected.forEach(function(value) {
      const chip = document.createElement('span');
      chip.className = 'answer-selected-chip';

      const text = document.createElement('span');
      text.className = 'answer-selected-chip-text';
      text.textContent = value;

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'answer-selected-chip-remove';
      remove.textContent = '×';
      remove.setAttribute('aria-label', 'Remove selected answer: ' + value);
      remove.addEventListener('click', function() {
        const inputs = box.querySelectorAll('#answerDropdownOptions input[type="checkbox"]');
        Array.from(inputs).forEach(function(input) {
          if (input.value === value) input.checked = false;
        });
        updateAnswerDropdownSummary();
      });

      chip.appendChild(text);
      chip.appendChild(remove);
      summary.appendChild(chip);
    });
  }

  function clearSelectedAnswerChoices() {
    const box = document.getElementById('sheetAnswers');
    if (!box) return;
    box.querySelectorAll('#answerDropdownOptions input[type="checkbox"]:checked')
      .forEach(function(input) { input.checked = false; });
    updateAnswerDropdownSummary();
  }

  function getAnswerBoxValue() {
    const box = document.getElementById('sheetAnswers');

    if (box.dataset.mode === 'dropdown' || box.dataset.mode === 'checkbox') {
      return Array.from(
        box.querySelectorAll('input[type="checkbox"]:checked')
      )
        .map(function(input) { return String(input.value || '').trim(); })
        .filter(Boolean)
        .join('; ')
        .trim();
    }

    const textarea = document.getElementById('answerTextInput');
    return textarea
      ? String(textarea.value || '').trim()
      : '';
  }

  function getSelectedCheckboxValues() {
    const box = document.getElementById('sheetAnswers');
    if (box.dataset.mode !== 'checkbox' && box.dataset.mode !== 'dropdown') return [];

    return Array.from(
      box.querySelectorAll('input[type="checkbox"]:checked')
    )
      .map(function(input) { return String(input.value || '').trim(); })
      .filter(Boolean);
  }

  // Serialize each selected closed-answer choice with the required #{...}# markers.
  // Keep the on-screen labels and editable text unwrapped for readability.
  function getAnswerValueForSaving() {
    const box = document.getElementById('sheetAnswers');
    if (box && (box.dataset.mode === 'dropdown' || box.dataset.mode === 'checkbox')) {
      return getSelectedCheckboxValues()
        .map(function(value) { return '#{' + value + '}#'; })
        .join('; ')
        .trim();
    }
    return getAnswerBoxValue();
  }

  function currentQuestion() {
    return questions[currentIndex];
  }

  function renderQuestion() {
    const q = currentQuestion();

    if (!q) {
      document.getElementById('counter').textContent = 'Finished';
      document.getElementById('question').textContent = 'All questions completed.';
      document.getElementById('language').textContent = '';
      return;
    }

    document.getElementById('counter').textContent =
      `Question ID: ${String(q.id ?? "").trim() || "(missing)"} — ${currentIndex + 1} of ${questions.length}`;

    document.getElementById('question').textContent = q.question;
    showQuestionSheetFields(q);
    document.getElementById('language').textContent =
      `Language: ${q.language}`;

    document.getElementById('transcript').textContent =
      q.answer || 'Press Start Answer and speak.';

    document.getElementById('saved').textContent = '';
    renderAnswerBox(q);
    document.getElementById('saveAnswerBtn').disabled = false;
    resetLiveEnglishTranslation('Waiting for speech...');
    setError('');
    setStatus('');

    resetQuestionAudio();
    // Always ask the backend for audio by question ID. Do not gate this on
    // q.audioUrl from the cached question list: after jumping to a question,
    // that cached field can be missing or stale even though Column D has a URL.
    // The backend re-reads Column D for this ID and returns the audio bytes.
    if (q.id !== undefined && q.id !== null && String(q.id).trim() !== '') {
      loadQuestionAudio(q.id);
    } else {
      document.getElementById('audioStatus').textContent =
        'Audio unavailable: this question has no ID.';
    }
  }

  function resetQuestionAudio() {
    questionAudioRequestId++;

    if (questionAudioUrl) {
      URL.revokeObjectURL(questionAudioUrl);
      questionAudioUrl = null;
    }

    const audio = document.getElementById('questionAudio');
    audio.pause();
    audio.removeAttribute('src');
    audio.load();

    document.getElementById('questionAudioWrap').style.display = 'none';
    document.getElementById('questionAudio').style.display = 'none';
    document.getElementById('playQuestionBtn').disabled = true;
    document.getElementById('audioStatus').textContent = '';
  }

  function loadQuestionAudio(id) {
    const requestId = ++questionAudioRequestId;
    const wrap = document.getElementById('questionAudioWrap');
    const button = document.getElementById('playQuestionBtn');
    const audio = document.getElementById('questionAudio');
    const status = document.getElementById('audioStatus');

    wrap.style.display = 'block';
    button.disabled = true;
    status.textContent = 'Loading question audio...';

    jsonpWithParams('audio', { id: id })
      .then(function(data) {
        if (requestId !== questionAudioRequestId) return;

        if (!data || !data.base64) {
          throw new Error('No audio data was returned for this question.');
        }

        const binary = atob(data.base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        const blob = new Blob(
          [bytes],
          { type: data.mimeType || 'audio/mpeg' }
        );

        questionAudioUrl = URL.createObjectURL(blob);
        audio.src = questionAudioUrl;
        audio.style.display = 'block';
        button.disabled = false;
        status.textContent = 'Question audio ready.';
      })
      .catch(function(err) {
        if (requestId !== questionAudioRequestId) return;

        button.disabled = true;
        status.textContent =
          'Audio unavailable: ' + (err.message || String(err));
      });
  }

  function playQuestionAudio() {
    const audio = document.getElementById('questionAudio');

    if (!audio.src) return;

    audio.currentTime = 0;
    audio.play().catch(function(err) {
      document.getElementById('audioStatus').textContent =
        'Could not play audio: ' + (err.message || String(err));
    });
  }

  function jsonp(action) {
    return jsonpWithParams(action, {});
  }

  function jsonpWithParams(action, params, options) {
    options = options || {};
    const timeoutMs = Number(options.timeoutMs) || 20000;
    const timeoutMessage = options.timeoutMessage || 'Backend request timed out.';

    return new Promise((resolve, reject) => {
      const requestId =
        'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      const frame = document.createElement('iframe');
      frame.style.display = 'none';
      frame.setAttribute('aria-hidden', 'true');

      let settled = false;
      const timer = setTimeout(() => {
        finish();
        reject(new Error(timeoutMessage));
      }, timeoutMs);

      function finish() {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        window.removeEventListener('message', onMessage);
        if (frame.parentNode) frame.parentNode.removeChild(frame);
      }

      function onMessage(event) {
        const data = event.data;
        if (!data || data.type !== 'voiceBridgeResponse') return;
        if (data.requestId !== requestId) return;

        finish();

        const payload = data.payload;
        if (!payload || payload.ok === false) {
          reject(new Error(payload && payload.error
            ? payload.error
            : 'Backend request failed.'));
          return;
        }

        resolve(payload);
      }

      window.addEventListener('message', onMessage);

      const query = new URLSearchParams();
      query.set('action', 'bridge');
      query.set('bridgeAction', action);
      query.set('requestId', requestId);

      Object.keys(params || {}).forEach(function(key) {
        query.set(key, String(params[key]));
      });

      query.set('_', Date.now());

      frame.src = BACKEND_URL + '?' + query.toString();
      document.body.appendChild(frame);
    });
  }

  async function loadQuestions() {
    try {
      setStatus('Loading questions...');
      const data = await jsonp('questions');

      questions = data.questions || [];

      if (!questions.length) {
        throw new Error('No questions were found in the Google Sheet.');
      }

      currentIndex = 0;
      renderQuestion();
      setStatus('Ready');
    } catch (err) {
      setStatus('Error');
      setError(err.message || String(err));
    }
  }

  async function getDeepgramToken() {
    const data = await jsonp('token');
    return data.token;
  }

  async function startAnswer() {
    if (isRecording) return;

    const q = currentQuestion();
    if (!q) return;

    setError('');
    document.getElementById('saved').textContent = '';
    resetLiveEnglishTranslation('Listening for speech...');
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    finalTranscript = '';
    interimTranscript = '';
    document.getElementById('transcript').textContent = '';

    try {
      // Do not clear the respondent cell before recording.
      // The eventual Save Answer action overwrites the same respondent cell,
      // which avoids an unnecessary backend request and prevents a timeout
      // from blocking microphone startup.
      finalTranscript = '';
      interimTranscript = '';
      document.getElementById('transcript').textContent = '';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error(
          'Microphone access is unavailable. Open this page over HTTPS ' +
          '(or localhost) in Chrome, Edge, or Safari.'
        );
      }

      // Request microphone permission only once per interview page.
      // Keep the MediaStream alive between questions.
      const streamStillUsable =
        mediaStream &&
        mediaStream.getTracks().some(track => track.readyState === 'live');

      if (!streamStillUsable) {
        setStatus('Requesting microphone (first question only)...');

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
      } else {
        setStatus('Microphone already allowed.');
      }

      setStatus('Getting Deepgram connection token...');
      const token = await getDeepgramToken();

      await connectDeepgram(token, q.language);

      isRecording = true;
      setStatus('Listening... Speak now.');

    } catch (err) {
      console.error(err);
      await cleanupAudio();

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;

      setStatus('Error');
      setError(err.message || String(err));
    }
  }

  function connectDeepgram(token, language) {
    return new Promise((resolve, reject) => {
      const lang = language || 'en-US';

      const params = new URLSearchParams({
        model: 'nova-3',
        language: lang,
        encoding: 'linear16',
        sample_rate: '16000',
        channels: '1',
        interim_results: 'true',
        punctuate: 'true',
        endpointing: '500'
      });

      const url = 'wss://api.deepgram.com/v1/listen?' + params.toString();

      // Browser WebSocket cannot set Authorization headers.
      // Deepgram supports the token through Sec-WebSocket-Protocol.
      ws = new WebSocket(url, ['bearer', token]);

      ws.onopen = () => {
        try {
          startAudioProcessing();
          resolve();
        } catch (err) {
          reject(err);
        }
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          const transcript =
            data.channel &&
            data.channel.alternatives &&
            data.channel.alternatives[0]
              ? data.channel.alternatives[0].transcript
              : '';

          if (!transcript) return;

          if (data.is_final) {
            finalTranscript +=
              (finalTranscript ? ' ' : '') + transcript;
            interimTranscript = '';

            // Translate only finalized Deepgram segments so the English
            // translation stays stable while still appearing near real time.
            queueLiveEnglishTranslation(transcript, language);
          } else {
            interimTranscript = transcript;
          }

          document.getElementById('transcript').textContent =
            finalTranscript +
            (interimTranscript
              ? (finalTranscript ? ' ' : '') + interimTranscript
              : '');
        } catch (err) {
          console.warn('Bad Deepgram message', err);
        }
      };

      ws.onerror = () => {
        reject(new Error('Deepgram WebSocket connection failed.'));
      };

      ws.onclose = (event) => {
        if (isRecording) {
          setError(
            'Deepgram connection closed. Code: ' +
            event.code
          );
        }
      };
    });
  }

  function startAudioProcessing() {
    if (!mediaStream) {
      throw new Error('Microphone stream is not available.');
    }

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    source = audioContext.createMediaStreamSource(mediaStream);

    // ScriptProcessorNode is widely supported in current browsers.
    processor = audioContext.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = function(event) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      const input = event.inputBuffer.getChannelData(0);
      const downsampled = downsampleBuffer(
        input,
        audioContext.sampleRate,
        16000
      );

      if (downsampled.length > 0) {
        const pcm = floatTo16BitPCM(downsampled);
        ws.send(pcm);
      }
    };

    source.connect(processor);
    processor.connect(audioContext.destination);
  }

  function downsampleBuffer(buffer, inputSampleRate, outputSampleRate) {
    if (outputSampleRate === inputSampleRate) {
      return buffer;
    }

    if (outputSampleRate > inputSampleRate) {
      throw new Error('Output sample rate cannot exceed input sample rate.');
    }

    const ratio = inputSampleRate / outputSampleRate;
    const newLength = Math.round(buffer.length / ratio);
    const result = new Float32Array(newLength);

    let offsetResult = 0;
    let offsetBuffer = 0;

    while (offsetResult < result.length) {
      const nextOffsetBuffer =
        Math.round((offsetResult + 1) * ratio);

      let accum = 0;
      let count = 0;

      for (
        let i = offsetBuffer;
        i < nextOffsetBuffer && i < buffer.length;
        i++
      ) {
        accum += buffer[i];
        count++;
      }

      result[offsetResult] = count ? accum / count : 0;
      offsetResult++;
      offsetBuffer = nextOffsetBuffer;
    }

    return result;
  }

  function floatTo16BitPCM(input) {
    const output = new Int16Array(input.length);

    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      output[i] = s < 0
        ? s * 0x8000
        : s * 0x7FFF;
    }

    return output.buffer;
  }

  async function stopAnswer() {
    if (!isRecording && !mediaStream) return;

    isRecording = false;
    setStatus('Finishing transcription...');
    document.getElementById('stopBtn').disabled = true;

    await finalizeDeepgram();

    const answer = finalTranscript.trim();

    await cleanupAudio();

    if (!answer) {
      document.getElementById('startBtn').disabled = false;
      setStatus('No speech was transcribed.');
      return;
    }

    const savedQuestionId = currentQuestion().id;

    document.getElementById('transcript').textContent = answer;
    document.getElementById('saved').textContent = '';
    setStatus('Saving answer...');

    try {
      // Save the answer and retrieve Column G (Response) from the same row.
      // The backend waits briefly after saving so any spreadsheet formula
      // that populates Column G has time to update before it is read.
      const data = await saveAnswerAndRetrieveG(savedQuestionId, answer);

      const responseText = String(data.columnG || '').trim();
      const liveEnglishBox = document.getElementById('liveEnglishTranslation');
      const answerBox = document.getElementById('sheetAnswers');

      liveEnglishBox.textContent = responseText
        ? responseText
        : 'No Response value returned from Column G.';

      // For closed-ended questions, keep Column F as the editable checkbox list.
      // For open-ended questions, place the transcription into the text editor.
      if (String(currentQuestion().closedAnswers || '').trim()) {
        renderAnswerBox(currentQuestion());
      } else {
        renderAnswerBox(currentQuestion(), [answer]);
      }

      document.getElementById('saved').textContent =
        '✓ Answer saved to Google Sheets';

      // Allow Start Answer to be clicked again for a retake.
      // The next click clears the current respondent cell before recording.
      document.getElementById('startBtn').disabled = false;
      document.getElementById('nextBtn').disabled = false;
      setStatus(responseText
        ? 'Answer saved — Response retrieved'
        : 'Answer saved — Column G is empty');

    } catch (err) {
      document.getElementById('saved').textContent = '';
      document.getElementById('startBtn').disabled = false;
      document.getElementById('nextBtn').disabled = false;
      setStatus('Save error');
      setError(err.message || String(err));
    }
  }

  function finalizeDeepgram() {
    return new Promise((resolve) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        resolve();
        return;
      }

      let done = false;
      const timer = setTimeout(finish, 1500);

      function finish() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve();
      }

      try {
        ws.send(JSON.stringify({ type: 'Finalize' }));
      } catch (e) {
        finish();
      }
    });
  }

  async function cleanupAudio() {
    try {
      if (processor) {
        processor.disconnect();
        processor.onaudioprocess = null;
      }

      if (source) {
        source.disconnect();
      }

      if (audioContext) {
        await audioContext.close();
      }
    } catch (e) {
      console.warn(e);
    }

    processor = null;
    source = null;
    audioContext = null;

    // IMPORTANT: keep mediaStream alive so the browser does not ask for
    // microphone permission again on the next question.
    // The microphone is stopped only when the interview page closes.

    if (ws) {
      try {
        if (ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING) {
          ws.close();
        }
      } catch (e) {
        console.warn(e);
      }
    }

    ws = null;
  }

  function clearAnswerCell(id) {
    return new Promise((resolve, reject) => {
      const callbackName =
        '__voiceClearCallback_' + Date.now() + '_' +
        Math.random().toString(36).slice(2);

      const script = document.createElement('script');

      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('Clear answer request timed out.'));
      }, 15000);

      window[callbackName] = function(data) {
        cleanup();

        if (!data || data.ok === false) {
          reject(new Error(data && data.error
            ? data.error
            : 'Could not clear the previous answer.'));
          return;
        }

        resolve(data);
      };

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      script.onerror = function() {
        cleanup();
        reject(new Error('Could not clear the previous answer from Apps Script.'));
      };

      const query = new URLSearchParams();
      query.set('action', 'clearAnswer');
      query.set('id', id);
      query.set('respondentSessionId', respondentSessionId);
      query.set('callback', callbackName);
      query.set('_', Date.now());

      script.src = BACKEND_URL + '?' + query.toString();
      document.head.appendChild(script);
    });
  }


  function saveAnswerAndRetrieveG(id, answer) {
    if (!id || !answer) {
      return Promise.reject(new Error('Missing question ID or answer.'));
    }

    // Save the answer and have Apps Script return the value from Column G
    // for the same question row after the save has completed.
    return jsonpWithParams('saveAndRetrieveG', {
      id: id,
      answer: answer,
      respondentSessionId: respondentSessionId
    }, {
      timeoutMs: 30000,
      timeoutMessage: 'Save and Response retrieval request timed out.'
    });
  }

  async function saveEditableAnswer() {
    if (isRecording) return;

    const q = currentQuestion();
    if (!q) return;

    const answer = getAnswerValueForSaving();

    if (!answer) {
      setStatus('Answer is empty');
      setError('Please enter an answer before clicking Save Answer.');
      return;
    }

    setError('');
    document.getElementById('saveAnswerBtn').disabled = true;
    setStatus('Saving edited answer...');

    try {
      const data = await saveEditableAnswerToSheet(q.id, answer);

      document.getElementById('transcript').textContent = answer;
      document.getElementById('saved').textContent =
        '✓ Answer updated in Google Sheets';

      const columnNumber = Number(data.respondentColumn || 0);
      setStatus(columnNumber >= 8
        ? (currentQuestion().closedAnswers
            ? 'Selected responses saved — Respondent column updated'
            : 'Answer updated — Respondent column saved')
        : 'Answer updated');
    } catch (err) {
      setStatus('Save error');
      setError(err.message || String(err));
    } finally {
      document.getElementById('saveAnswerBtn').disabled = false;
    }
  }

  function saveEditableAnswerToSheet(id, answer) {
    return jsonpWithParams('save', {
      id: id,
      answer: answer,
      respondentSessionId: respondentSessionId
    }, {
      timeoutMs: 30000,
      timeoutMessage: 'Save Answer request timed out.'
    });
  }

  let movingToNextQuestion = false;

  async function nextQuestion() {
    if (isRecording) {
      setStatus('Stop & Save the current answer before moving to the next question.');
      return;
    }

    if (movingToNextQuestion) return;

    const nextIndex = currentIndex + 1;
    if (nextIndex >= questions.length) {
      setStatus('All questions completed.');
      return;
    }

    movingToNextQuestion = true;
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.disabled = true;

    try {
      // First advance using the question data already loaded on the page.
      // This is important on managed tablets where a fresh Apps Script bridge
      // request can time out even though the original question list loaded.
      // We therefore use a best-effort sheet refresh, but never make Next
      // Question depend on that extra backend request.
      let refreshed = false;
      try {
        setStatus('Refreshing questions...');
        const data = await jsonpWithParams('questions', {}, {
          timeoutMs: 12000,
          timeoutMessage: 'Question refresh timed out; using loaded questions.'
        });
        const refreshedQuestions = Array.isArray(data.questions)
          ? data.questions
          : [];

        if (refreshedQuestions.length) {
          questions = refreshedQuestions;
          refreshed = true;
        }
      } catch (refreshErr) {
        // Ignore refresh failures. The currently loaded question list remains
        // authoritative for navigation so the tablet can continue.
        setStatus('Using loaded questions...');
      }

      const activeQuestions = Array.isArray(questions) ? questions : [];
      if (!activeQuestions.length) {
        throw new Error('No questions are loaded.');
      }

      if (nextIndex >= activeQuestions.length) {
        currentIndex = Math.max(0, activeQuestions.length - 1);
        renderQuestion();
        setStatus('All questions completed.');
        return;
      }

      currentIndex = nextIndex;

      resetLiveEnglishTranslation('Waiting for speech...');
      renderQuestion();

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      setStatus(refreshed ? 'Ready' : 'Ready (using loaded questions)');
    } catch (err) {
      setStatus('Error');
      setError(err.message || String(err));
    } finally {
      movingToNextQuestion = false;
      if (nextBtn) nextBtn.disabled = false;
    }
  }

  async function jumpToQuestion() {
    if (isRecording) {
      setStatus('Stop & Save the current answer before jumping to another question.');
      return;
    }
    if (movingToNextQuestion) return;

    const input = document.getElementById('jumpQuestionNumber');
    const requestedId = String(input.value || '').trim();
    if (!requestedId) {
      setStatus('Enter a question ID from column A.');
      input.focus();
      return;
    }

    // Refresh before resolving the target. The cached question list can be
    // stale after sheet edits/reordering, which can pair a jump number with
    // the wrong question ID and therefore the wrong/missing Column D audio.
    const jumpButton = document.getElementById('jumpQuestionBtn');
    jumpButton.disabled = true;
    setStatus('Refreshing target question and audio reference...');
    try {
      const freshData = await jsonpWithParams('questions', {}, {
        timeoutMs: 15000,
        timeoutMessage: 'Could not refresh questions; using the loaded list.'
      });
      if (freshData && Array.isArray(freshData.questions) && freshData.questions.length) {
        questions = freshData.questions;
      }
    } catch (refreshErr) {
      // Keep navigation usable when a tablet/network cannot refresh.
      console.warn('Question refresh failed; using cached question list:', refreshErr);
    } finally {
      jumpButton.disabled = false;
    }

    if (!Array.isArray(questions) || !questions.length) {
      setStatus('Questions are not loaded yet.');
      return;
    }
    // Match the ID returned from spreadsheet column A, not the question's
    // position in the loaded array. String matching preserves IDs such as 0012.
    const targetIndex = questions.findIndex(function(question) {
      return String(question && question.id != null ? question.id : '').trim() === requestedId;
    });
    if (targetIndex === -1) {
      setStatus('Question ID "' + requestedId + '" was not found in column A.');
      input.focus();
      return;
    }

    currentIndex = targetIndex;
    resetLiveEnglishTranslation('Waiting for speech...');
    renderQuestion(); // renderQuestion resets old audio and fetches Column D audio by the selected question ID.
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    setStatus(`Jumped to question ID ${requestedId}; loading its audio...`);
  }

  document.getElementById('jumpQuestionNumber').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      jumpToQuestion();
    }
  });

  function releaseMicrophone() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
  }

  window.addEventListener('beforeunload', function() {
    cleanupAudio();
    releaseMicrophone();
 

    if (questionAudioUrl) {
      URL.revokeObjectURL(questionAudioUrl);
      questionAudioUrl = null;
    }
  });

  loadQuestions();
</script>
</body>
</html>
