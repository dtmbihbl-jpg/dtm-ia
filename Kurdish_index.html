  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8fb;
      color: #163a4a;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    .app {
      width: min(1100px, 96vw);
      margin: 12px auto;
      padding: 12px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }
    h1 {
      text-align: center;
      color: #009EDB;
      margin: 0 0 6px;
      font-size: 26px;
    }
    .counter, .language {
      text-align: center;
      color: #5f6368;
      margin: 4px 0;
      font-size: 14px;
    }
    .question-row,
    .bottom-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      width: 100%;
    }
    .question-box,
    .question-info-box {
      background: #e8f4f9;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      padding: 14px 16px;
      line-height: 1.35;
      text-align: left;
      color: #21414f;
      white-space: pre-wrap;
      min-width: 0;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .question-box {
      flex: 1 1 0;
      min-height: 92px;
      font-size: 22px;
    }
    .question-box-label,
    .question-info-label {
      display: none;
    }
    .question-info-box {
      flex: 1 1 0;
      min-height: 92px;
      font-size: 20px;
      margin: 0;
      display: none;
    }
    .bottom-row {
      margin-top: 10px;
    }
    .bottom-row > .question-info-box {
      flex: 1 1 0;
      min-width: 0;
      margin: 0;
    }
    .answer-section {
      width: 100%;
      margin-top: 12px;
    }
    .answer-title {
      font-weight: bold;
      font-size: 15px;
      color: #4f6b78;
      margin: 0 0 5px;
    }
    .answer-box {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      background: #ffffff;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      color: #21414f;
      font-size: 18px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .answer-box:focus {
      border-color: #009EDB;
      box-shadow: 0 0 0 2px rgba(0, 158, 219, 0.12);
    }
    .answer-help {
      margin: -1px 0 7px;
      font-size: 12px;
      color: #6b8490;
    }
    /* Searchable multi-select dropdown for the spreadsheet's closed answers. */
    .answer-box.answer-box-dropdown {
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      overflow: visible;
    }
    .answer-dropdown {
      position: relative;
      width: 100%;
    }
    .answer-dropdown-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 54px;
      padding: 12px 14px;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      background: #fff;
      color: #21414f;
      font: inherit;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }
    .answer-dropdown-toggle:focus,
    .answer-search:focus {
      outline: 2px solid rgba(0, 158, 219, .3);
      outline-offset: 1px;
      border-color: #009EDB;
    }
    .answer-dropdown-label {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .answer-dropdown-chevron {
      flex: 0 0 auto;
      font-size: 18px;
      line-height: 1;
    }
    .answer-selected-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .answer-selected-summary:empty { display: none; }
    .answer-selected-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 5px 8px 5px 10px;
      border: 1px solid #a9d7e6;
      border-radius: 999px;
      background: #e8f4f9;
      color: #21414f;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .answer-selected-chip-text { min-width: 0; }
    .answer-selected-chip-remove {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #21414f;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    .answer-selected-chip-remove:hover { background: rgba(0, 158, 219, .13); }
    .answer-dropdown-panel {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(22, 58, 74, .12);
    }
    .answer-dropdown-panel[hidden] { display: none !important; }
    .answer-search {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid #b8d9e5;
      border-radius: 8px;
      background: #fff;
      color: #21414f;
      font: inherit;
    }
    .answer-wildcard-help {
      margin: 7px 1px;
      color: #607985;
      font-size: 12px;
      line-height: 1.4;
    }
    .answer-dropdown-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: min(36vh, 320px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 2px 2px 4px;
      -webkit-overflow-scrolling: touch;
    }
    .answer-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 11px;
      border: 1px solid #d3e7ee;
      border-radius: 8px;
      background: #f8fcfe;
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    .answer-option[hidden] { display: none !important; }
    .answer-option:hover {
      background: #eef9fd;
      border-color: #a9d7e6;
    }
    .answer-option input[type=checkbox] {
      width: 24px;
      height: 24px;
      margin: 1px 0 0;
      accent-color: #009EDB;
      flex: 0 0 auto;
      touch-action: manipulation;
    }
    .answer-option span {
      flex: 1 1 auto;
      min-width: 0;
    }
    .answer-no-results {
      padding: 12px 8px;
      color: #607985;
      font-size: 14px;
    }
    .answer-dropdown-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      padding-top: 9px;
      border-top: 1px solid #e2edf1;
    }
    .answer-match-count { color: #607985; font-size: 12px; }
    .answer-dropdown-actions { display: flex; gap: 8px; }
    .answer-dropdown-actions button {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid #b8d9e5;
      border-radius: 8px;
      background: #f5fbfd;
      color: #21414f;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .answer-dropdown-actions button:hover { background: #e8f4f9; }
    @media (max-width: 700px) {
      .answer-dropdown-toggle { min-height: 56px; }
      .answer-search { min-height: 50px; font-size: 16px; }
      .answer-dropdown-options { max-height: 34vh; }
      .answer-option { padding: 11px; }
    }
    .answer-textarea {
      width: 100%;
      min-height: 120px;
      border: 0;
      outline: none;
      resize: vertical;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: inherit;
    }
    .answer-save-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    #saveAnswerBtn {
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      background: #009EDB;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    #saveAnswerBtn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .question-audio-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    .question-audio-row button {
      width: auto;
      min-height: 48px;
      flex: 0 0 auto;
      padding: 11px 16px;
      font-size: 16px;
      touch-action: manipulation;
    }
    .question-audio-row .language {
      flex: 1;
      margin: 0;
    }
    #questionAudio {
      width: 100%;
      max-width: 700px;
      display: none;
      margin: 6px auto 0;
    }
    .action-row {
      display: flex;
      gap: 8px;
      width: 100%;
      margin: 8px 0;
    }
    .jump-question-control {
      flex: 1.2 1 0;
      min-width: 170px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid #d4dbe5;
      border-radius: 9px;
      background: #f8fafc;
    }
    .jump-question-control label {
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
    .jump-question-control input {
      flex: 1 1 70px;
      min-width: 0;
      width: 70px;
      margin: 0;
      min-height: 42px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .action-row .jump-question-control button {
      flex: 0 0 auto;
      width: auto;
      min-height: 42px;
      padding: 9px 14px;
      margin: 0;
    }
    .action-row button {
      flex: 1 1 0;
      width: auto;
      min-height: 50px;
      margin: 0;
      border: 0;
      border-radius: 9px;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    #startBtn { background: #009EDB; color: white; }
    #stopBtn { background: #5f93a8; color: white; }
    #nextBtn { background: #7fb6c8; color: white; }
    #mandatoryBtn { background: #c62828; color: white; }
    #jumpQuestionNumber { flex: 1 1 180px; width: 100%; }
    #jumpMatches { width: 100%; max-height: 220px; overflow-y: auto; }
    #jumpMatches button { display: block; width: 100%; text-align: left; margin: 2px 0; background: #eaf4f9; color: #163a4a; font-weight: normal; }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      color: #315a6d;
      font-size: 16px;
      font-weight: bold;
      margin: 8px 0;
      min-height: 20px;
    }
    .live-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      width: 100%;
      margin-top: 2px;
    }
    .live-panel {
      flex: 1 1 0;
      min-width: 0;
    }
    .live-panel-label {
      font-weight: bold;
      font-size: 13px;
      color: #4f6b78;
      margin-bottom: 5px;
    }
    .live {
      height: auto;
      max-height: none;
      overflow: visible;
      overflow-wrap: anywhere;
      word-break: break-word;
      background: #ffffff;
      border: 1px solid #b8d9e5;
      border-radius: 10px;
      min-height: 120px;
      padding: 14px;
      font-size: 18px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .live.translation-live {
      background: #eaf6fb;
      border-color: #b8d9e5;
    }
    .error {
      color: #d93025;
      white-space: pre-wrap;
      margin-top: 8px;
      font-size: 14px;
    }
    .saved {
      color: #188038;
      text-align: center;
      font-weight: bold;
      margin-top: 8px;
      font-size: 14px;
    }
    /* Tablet layout: keep Chinese + English side-by-side, stack the live panels,
       and enlarge controls for touch. */
    @media (max-width: 900px) {
      .app {
        width: 100%;
        margin: 0 auto;
        padding: 16px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .counter, .language {
        font-size: 16px;
      }

      .question-row {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        gap: 12px;
      }

      .question-box,
      .question-info-box {
        flex: 1 1 0;
        width: 0;
        min-width: 0;
        min-height: 96px;
        padding: 14px 16px;
        font-size: 22px;
        line-height: 1.35;
      }

      .question-info-box {
        font-size: 20px;
      }

      .live-row {
        flex-direction: column;
        gap: 12px;
      }

      .live {
        min-height: 150px;
        font-size: 19px;
      }

      .answer-box {
        min-height: 150px;
        font-size: 18px;
      }

      .answer-option {
        min-height: 50px;
        padding: 11px 12px;
        gap: 12px;
        font-size: 17px;
      }

      .status {
        font-size: 17px;
      }
    }

    @media (max-width: 560px) {
      .question-row,
      .bottom-row,
      .action-row {
        flex-direction: column;
      }

      .question-box,
      .question-info-box {
        width: 100%;
        min-height: 90px;
        font-size: 20px;
      }

      .question-info-box {
        font-size: 19px;
      }

      .action-row {
        gap: 8px;
      }

      .action-row button {
        width: 100%;
      }

      .jump-question-control {
        width: 100%;
        box-sizing: border-box;
      }
      .action-row .jump-question-control button {
        width: auto;
      }

      .question-audio-row {
        align-items: stretch;
        flex-direction: column;
      }

      .question-audio-row button {
        width: 100%;
      }

      .answer-save-row {
        justify-content: stretch;
      }

      #saveAnswerBtn {
        width: 100%;
      }
    }
  </style>
</head>

<script>
  // The backend reads spreadsheet 1Kcl06RWGxSmoUtEOfYEvi1rmVlfPFs4X3WM0dmH9tjM, tab gid 1399070115.
  // Paste the deployed Apps Script WEB APP URL here (not the Google Sheets URL).
  const KURDISH_DIALECT = 'sorani'; // Change to 'kurmanji' if appropriate.
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbySLhkbTqvx-ReuIaEOt09fuGftMxCwwT_lMtRhvEeld46cqB5khI5FBDZXCQLwebRtgA/exec';

  let questions = [];
  let currentIndex = 0;

  // One respondent session per browser tab/interview.
  // Apps Script uses this ID to keep all answers from this interview
  // in the same respondent column (P, Q, R, ...).
  // One new respondent session for each fresh page load.
  // All answers in this interview use the same server-assigned column.
  const respondentSessionId =
    (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'session_' + Date.now() + '_' + Math.random().toString(36).slice(2);

  let ws = null;
  let mediaStream = null;

  let questionAudioUrl = null;
  let questionAudioRequestId = 0;
  let audioContext = null;
  let source = null;
  let processor = null;

  let finalTranscript = '';
  let interimTranscript = '';
  let isRecording = false;

  // Translate the latest full Kurdish snapshot while speech is in progress.
  // Only one request at a time; throttle to avoid excessive Apps Script calls.
  let translationGeneration = 0;
  let translationFlushTimer = null;
  let translationBusy = false;
  let translationPending = '';
  let translationLastRequested = '';
  let translationLastRequestAt = 0;
  const LIVE_TRANSLATION_INTERVAL_MS = 2400;

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  function setError(text) {
    document.getElementById('error').textContent = text || '';
  }


  function resetLiveEnglishTranslation(message) {
    translationGeneration++;
    if (translationFlushTimer) clearTimeout(translationFlushTimer);
    translationFlushTimer = null;
    translationBusy = false;
    translationPending = '';
    translationLastRequested = '';
    translationLastRequestAt = 0;
    document.getElementById('liveEnglishTranslation').textContent =
      message || 'Waiting for transcription...';
  }

  function normalizeLanguageCode(language) {
    const value = String(language || '').trim().toLowerCase();
    return value ? value.split(/[-_]/)[0] : '';
  }

  // Interim KurdishTTS results are often revised. Translate the complete
  // current snapshot (final + interim), replacing the preview rather than
  // appending overlapping translations.
  function queueLiveEnglishTranslation() {
    if (!isRecording) return;
    const snapshot = transcriptCheckpoint.trim();
    if (!snapshot || snapshot === translationLastRequested) return;
    translationPending = snapshot;
    scheduleLiveEnglishTranslation();
  }

  function scheduleLiveEnglishTranslation() {
    if (translationBusy || !translationPending || translationFlushTimer) return;
    const wait = Math.max(0, LIVE_TRANSLATION_INTERVAL_MS -
      (Date.now() - translationLastRequestAt));
    translationFlushTimer = setTimeout(function() {
      translationFlushTimer = null;
      processLiveEnglishTranslationQueue();
    }, wait);
  }

  function processLiveEnglishTranslationQueue() {
    if (!isRecording || translationBusy || !translationPending) return;
    const snapshot = translationPending;
    translationPending = '';
    if (snapshot === translationLastRequested) return;
    const generation = translationGeneration;
    translationBusy = true;
    translationLastRequested = snapshot;
    translationLastRequestAt = Date.now();

    jsonpWithParams('translate', {
      text: snapshot,
      sourceLanguage: KURDISH_DIALECT === 'sorani' ? 'ckb' : 'kmr'
    }, { timeoutMs: 18000, timeoutMessage: 'Live translation delayed.' })
      .then(function(data) {
        if (generation !== translationGeneration || !isRecording) return;
        const english = String(data.translation || '').trim();
        if (english) document.getElementById('liveEnglishTranslation').textContent = english;
      })
      .catch(function(err) {
        if (generation !== translationGeneration || !isRecording) return;
        console.warn('Live English translation delayed:', err);
        // Preserve the last successful translation; don't replace it with errors.
        const box = document.getElementById('liveEnglishTranslation');
        if (!box.textContent || box.textContent.startsWith('Waiting for')) {
          box.textContent = 'Translating...';
        }
      })
      .finally(function() {
        if (generation !== translationGeneration) return;
        translationBusy = false;
        if (isRecording && translationPending) scheduleLiveEnglishTranslation();
      });
  }

  function showQuestionSheetFields(q) {
    const questionBox = document.getElementById('sheetQuestion');
    const questionText = document.getElementById('sheetQuestionText');

    const questionValue = String(q.englishQuestion || '').trim();

    questionText.textContent = questionValue;
    questionBox.style.display = questionValue ? 'block' : 'none';
  }

  function parseClosedAnswerOptions(text) {
    return String(text || '')
      .split(/\||;|\n/)
      .map(function(value) { return value.trim(); })
      .filter(Boolean);
  }

  function renderAnswerBox(q, selectedValues) {
    const box = document.getElementById('sheetAnswers');
    const help = document.getElementById('answerHelp');
    const options = parseClosedAnswerOptions(q.closedAnswers);
    const selected = Array.isArray(selectedValues)
      ? selectedValues.map(function(value) { return String(value).trim(); })

    box.innerHTML = '';

    if (options.length) {
      box.classList.add('answer-box-dropdown');
      help.textContent = 'Choose one or more responses. Search supports * and ? wildcards.';

      const dropdown = document.createElement('div');

      toggleLabel.id = 'answerDropdownLabel';
      toggleLabel.textContent = 'Choose answer choices';

      const chevron = document.createElement('span');
      chevron.className = 'answer-dropdown-chevron';
      chevron.setAttribute('aria-hidden', 'true');
      chevron.textContent = '▾';

      toggle.appendChild(chevron);

      const selectedSummary = document.createElement('div');
      selectedSummary.className = 'answer-selected-summary';
      selectedSummary.id = 'answerSelectedSummary';
      selectedSummary.setAttribute('aria-live', 'polite');

      const panel = document.createElement('div');
      panel.className = 'answer-dropdown-panel';
      panel.id = 'answerDropdownPanel';

      const search = document.createElement('input');

      const list = document.createElement('div');
      list.className = 'answer-dropdown-options';

      list.setAttribute('role', 'group');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = option;
        checkbox.id = 'answerOption_' + index;
        checkbox.dataset.optionIndex = String(index);
        checkbox.checked = selected.indexOf(option) !== -1;
        checkbox.addEventListener('change', updateAnswerDropdownSummary);

        const span = document.createElement('span');
        span.textContent = option;

        label.appendChild(checkbox);
        label.appendChild(span);
        list.appendChild(label);
      });

      const noResults = document.createElement('div');
      noResults.className = 'answer-no-results';
      noResults.id = 'answerChoiceNoResults';
      noResults.textContent = 'No matching choices.';

    textarea.className = 'answer-textarea';

  function toggleAnswerDropdown() {
    const panel = document.getElementById('answerDropdownPanel');
    const toggle = document.getElementById('answerDropdownToggle');
    if (!panel || !toggle) return;

    const shouldOpen = panel.hidden;
    panel.hidden = !shouldOpen;
    toggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
    if (shouldOpen) {
      const search = document.getElementById('answerChoiceSearch');
      if (search) search.focus({ preventScroll: true });
    }
  }

  function closeAnswerDropdown() {
    const panel = document.getElementById('answerDropdownPanel');
    const toggle = document.getElementById('answerDropdownToggle');
    if (!panel || !toggle) return;
    panel.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
  }

  function normalizeAnswerSearchText(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLocaleLowerCase();
  }

  function answerOptionMatchesSearch(option, query) {
    const normalizedOption = normalizeAnswerSearchText(option);
    const normalizedQuery = normalizeAnswerSearchText(query).trim();
    if (!normalizedQuery) return true;

    // Without wildcard symbols, find the text anywhere in the answer choice.
    if (normalizedQuery.indexOf('*') === -1 && normalizedQuery.indexOf('?') === -1) {
      return normalizedOption.indexOf(normalizedQuery) !== -1;
    }

    // In wildcard mode, match the complete choice: * = any sequence; ? = one character.
    const pattern = Array.from(normalizedQuery).map(function(character) {
      if (character === '*') return '.*';
      if (character === '?') return '.';
      return character.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('');

    try {
      return new RegExp('^' + pattern + '$', 'i').test(normalizedOption);
    } catch (err) {
      return false;
    }
  }

  function filterAnswerOptions() {
    const box = document.getElementById('sheetAnswers');
    const search = document.getElementById('answerChoiceSearch');
    const list = document.getElementById('answerDropdownOptions');
    const noResults = document.getElementById('answerChoiceNoResults');
    const matchCount = document.getElementById('answerChoiceMatchCount');
    if (!box || box.dataset.mode !== 'dropdown' || !search || !list) return;

    const query = search.value || '';
    const optionRows = Array.from(list.querySelectorAll('.answer-option'));
    let visibleCount = 0;

    optionRows.forEach(function(row) {
      const checkbox = row.querySelector('input[type="checkbox"]');
      const matched = answerOptionMatchesSearch(checkbox ? checkbox.value : '', query);
      row.hidden = !matched;
      if (matched) visibleCount++;
    });

    if (noResults) noResults.hidden = visibleCount !== 0;
    if (matchCount) matchCount.textContent = visibleCount + ' of ' + optionRows.length + ' choices shown';
  }

  function updateAnswerDropdownSummary() {
    const box = document.getElementById('sheetAnswers');
    if (!box || box.dataset.mode !== 'dropdown') return;

    const toggleLabel = document.getElementById('answerDropdownLabel');
    const summary = document.getElementById('answerSelectedSummary');
    const selected = Array.from(
      box.querySelectorAll('#answerDropdownOptions input[type="checkbox"]:checked')
    ).map(function(input) { return String(input.value || '').trim(); }).filter(Boolean);

    if (toggleLabel) {
      toggleLabel.textContent = selected.length
        ? selected.length + ' answer choice' + (selected.length === 1 ? '' : 's') + ' selected — edit choices'
        : 'Choose answer choices';
    }

    if (!summary) return;
    summary.innerHTML = '';

    selected.forEach(function(value) {
      const chip = document.createElement('span');
      chip.className = 'answer-selected-chip';

      const text = document.createElement('span');
      text.className = 'answer-selected-chip-text';
      text.textContent = value;

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'answer-selected-chip-remove';
      remove.textContent = '×';
      remove.setAttribute('aria-label', 'Remove selected answer: ' + value);
      remove.addEventListener('click', function() {
        const inputs = box.querySelectorAll('#answerDropdownOptions input[type="checkbox"]');
        Array.from(inputs).forEach(function(input) {
          if (input.value === value) input.checked = false;
        });
        updateAnswerDropdownSummary();
      });

      chip.appendChild(text);
      chip.appendChild(remove);
      summary.appendChild(chip);
    });
  }

  function clearSelectedAnswerChoices() {
    const box = document.getElementById('sheetAnswers');
    if (!box) return;
    box.querySelectorAll('#answerDropdownOptions input[type="checkbox"]:checked')
      .forEach(function(input) { input.checked = false; });
    updateAnswerDropdownSummary();
  }

  function getAnswerBoxValue() {
    const box = document.getElementById('sheetAnswers');

    if (box.dataset.mode === 'dropdown' || box.dataset.mode === 'checkbox') {
      return Array.from(
        box.querySelectorAll('input[type="checkbox"]:checked')
      )
        .map(function(input) { return String(input.value || '').trim(); })
        .filter(Boolean)
        .join('; ')
        .trim();
    }

    const textarea = document.getElementById('answerTextInput');
    return textarea
      ? String(textarea.value || '').trim()
      : '';
  }

  function getSelectedCheckboxValues() {
    const box = document.getElementById('sheetAnswers');
    if (box.dataset.mode !== 'checkbox' && box.dataset.mode !== 'dropdown') return [];

    return Array.from(
      box.querySelectorAll('input[type="checkbox"]:checked')
    )
      .map(function(input) { return String(input.value || '').trim(); })
      .filter(Boolean);
  }

  // Serialize each selected closed-answer choice with the required #{...}# markers.
  // Keep the on-screen labels and editable text unwrapped for readability.
  function getAnswerValueForSaving() {
    const box = document.getElementById('sheetAnswers');
    if (box && (box.dataset.mode === 'dropdown' || box.dataset.mode === 'checkbox')) {
      return getSelectedCheckboxValues()
        .map(function(value) { return '#{' + value + '}#'; })
        .join('; ')
        .trim();
    }
    return getAnswerBoxValue();
  }

  function currentQuestion() {
    return questions[currentIndex];
  }

  function renderQuestion() {
    const q = currentQuestion();

    if (!q) {
      document.getElementById('counter').textContent = 'Finished';
      document.getElementById('question').textContent = 'All questions completed.';
      document.getElementById('language').textContent = '';
      return;
    }

    document.getElementById('counter').textContent =
      `Question ${currentIndex + 1} of ${questions.length}`;

    document.getElementById('question').textContent = q.question;
    showQuestionSheetFields(q);
    document.getElementById('language').textContent =
      `Language: ${q.language}`;

    document.getElementById('transcript').textContent =
      q.answer || 'Press Start Answer, speak Kurdish, then Stop & Save.';

    document.getElementById('saved').textContent = '';
    renderAnswerBox(q);
    document.getElementById('saveAnswerBtn').disabled = false;
    resetLiveEnglishTranslation('Waiting for transcription...');
    setError('');
    setStatus('');

    resetQuestionAudio();
    if (q.audioUrl) {
      loadQuestionAudio(q.id);
    }
  }

  function resetQuestionAudio() {
    questionAudioRequestId++;

    if (questionAudioUrl) {
      URL.revokeObjectURL(questionAudioUrl);
      questionAudioUrl = null;
    }

    const audio = document.getElementById('questionAudio');
    audio.pause();
    audio.removeAttribute('src');
    audio.load();

    document.getElementById('questionAudioWrap').style.display = 'none';
    document.getElementById('questionAudio').style.display = 'none';
    document.getElementById('playQuestionBtn').disabled = true;
    document.getElementById('audioStatus').textContent = '';
  }

  function loadQuestionAudio(id) {
    const requestId = ++questionAudioRequestId;
    const wrap = document.getElementById('questionAudioWrap');
    const button = document.getElementById('playQuestionBtn');
    const audio = document.getElementById('questionAudio');
    const status = document.getElementById('audioStatus');

    wrap.style.display = 'block';
    button.disabled = true;
    status.textContent = 'Loading question audio...';

    jsonpWithParams('audio', { id: id })
      .then(function(data) {
        if (requestId !== questionAudioRequestId) return;

        if (!data || !data.base64) {
          throw new Error('No audio data was returned for this question.');
        }

        const binary = atob(data.base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        const blob = new Blob(
          [bytes],
          { type: data.mimeType || 'audio/mpeg' }
        );

        questionAudioUrl = URL.createObjectURL(blob);
        audio.src = questionAudioUrl;
        audio.style.display = 'block';
        button.disabled = false;
        status.textContent = 'Question audio ready.';
      })
      .catch(function(err) {
        if (requestId !== questionAudioRequestId) return;

        button.disabled = true;
        status.textContent =
          'Audio unavailable: ' + (err.message || String(err));
      });
  }

  function playQuestionAudio() {
    const audio = document.getElementById('questionAudio');

    if (!audio.src) return;

    audio.currentTime = 0;
    audio.play().catch(function(err) {
      document.getElementById('audioStatus').textContent =
        'Could not play audio: ' + (err.message || String(err));
    });
  }

  function jsonp(action) {
    return jsonpWithParams(action, {});
  }

  function jsonpWithParams(action, params, options) {
    options = options || {};
    const timeoutMs = Number(options.timeoutMs) || 20000;
    const timeoutMessage = options.timeoutMessage || 'Backend request timed out.';

    return new Promise((resolve, reject) => {
      const requestId =
        'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      const frame = document.createElement('iframe');
      frame.style.display = 'none';
      frame.setAttribute('aria-hidden', 'true');

      let settled = false;
      const timer = setTimeout(() => {
        finish();
        reject(new Error(timeoutMessage));
      }, timeoutMs);

      function finish() {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        window.removeEventListener('message', onMessage);
        if (frame.parentNode) frame.parentNode.removeChild(frame);
      }

      function onMessage(event) {
        const data = event.data;
        if (!data || data.type !== 'voiceBridgeResponse') return;
        if (data.requestId !== requestId) return;

        finish();

        const payload = data.payload;
        if (!payload || payload.ok === false) {
          reject(new Error(payload && payload.error
            ? payload.error
            : 'Backend request failed.'));
          return;
        }

        resolve(payload);
      }

      window.addEventListener('message', onMessage);

      const query = new URLSearchParams();
      query.set('action', 'bridge');
      query.set('bridgeAction', action);
      query.set('requestId', requestId);

      Object.keys(params || {}).forEach(function(key) {
        query.set(key, String(params[key]));
      });

      query.set('_', Date.now());

      frame.src = BACKEND_URL + '?' + query.toString();
      document.body.appendChild(frame);
    });
  }

  async function loadQuestions() {
    try {
      setStatus('Loading questions...');
      const data = await jsonp('questions');

      questions = data.questions || [];

      if (!questions.length) {
        throw new Error('No questions were found in the Google Sheet.');
      }

      currentIndex = 0;
      renderQuestion();
      setStatus('Ready');
    } catch (err) {
      setStatus('Error');
      setError(err.message || String(err));
    }
  }

  async function getDeepgramToken() {
    const data = await jsonp('token');
    return data.token;
  }

  let recordingQuestionId = null;
  let streamingDone = null;
  let streamingFinish = null;
  let streamFinalParts = [];
  let streamInterim = '';
  let streamAudioActive = false;
  let lastNonemptyInterim = '';
  let transcriptCheckpoint = '';

  // Preserve every recognition window, even when the provider silently
  // restarts its interim transcript. Never use a shorter hypothesis to erase
  // previously displayed words.
  let committedSpeech = '';
  let previousHypothesis = '';
  let lastMessageAt = 0;
  let lastAudioSentAt = 0;
  let streamWatchdog = null;
  let reconnecting = false;
  let streamGeneration = 0;
  let reconnectAttempts = 0;
  const STREAM_STALL_MS = 20000;
  const STREAM_CHECK_MS = 4000;
  const MAX_RECONNECT_ATTEMPTS = 8;

  function stopStreamWatchdog() {
    if (streamWatchdog) clearInterval(streamWatchdog);
    streamWatchdog = null;
  }

  async function connectKurdishSocket(generation) {
    const session = await jsonpWithParams('streamConnect',
      {dialect:KURDISH_DIALECT}, {timeoutMs:30000});
    if (!isRecording && streamAudioActive === false && generation !== streamGeneration)
      throw new Error('Recording ended.');
    const socket = new WebSocket(session.websocket_url);
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => { socket.close(); reject(new Error('WebSocket connection timed out')); }, 15000);
      socket.addEventListener('open', () => { clearTimeout(timer); resolve(); }, {once:true});
      socket.addEventListener('error', () => { clearTimeout(timer); reject(new Error('WebSocket connection failed')); }, {once:true});
    });
    if (generation !== streamGeneration) { socket.close(); throw new Error('Recording ended.'); }
    ws = socket;
    lastMessageAt = Date.now();
    socket.onmessage = e => {
      if (generation !== streamGeneration || socket !== ws) return;
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'control' && msg.event === 'done') {
          if (isRecording) reconnectKurdishSocket(generation, 'stream ended');
          else if (streamingFinish) streamingFinish('done');
          return;
        }
        if (msg.type === 'error') {
          setError(msg.detail || msg.error || 'KurdishTTS streaming error');
          if (isRecording) reconnectKurdishSocket(generation, 'provider error');
          else if (streamingFinish) streamingFinish('error');
          return;
        }
        acceptKurdishMessage(msg);
      } catch(err) { console.warn('Unrecognized KurdishTTS message:', err); }
    };
    socket.onerror = () => {
      if (isRecording) reconnectKurdishSocket(generation, 'socket error');
      else if (streamingFinish) streamingFinish('socket-error');
    };
    socket.onclose = () => {
      if (isRecording) reconnectKurdishSocket(generation, 'socket closed');
      else if (streamingFinish) streamingFinish('closed');
    };
  }

  async function reconnectKurdishSocket(generation, reason) {
    if (!isRecording || generation !== streamGeneration || reconnecting) return;
    reconnecting = true;
    // Retain all text from the old recognition window before reconnecting.
    committedSpeech = joinSpeech(committedSpeech, streamInterim || previousHypothesis);
    streamInterim = ''; previousHypothesis = '';
    renderPersistentTranscript();
    if (ws) { const old = ws; ws = null; try { old.close(); } catch(e) {} }
    while (isRecording && generation === streamGeneration && reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
      reconnectAttempts++;
      setStatus('Reconnecting Kurdish transcription (' + reason + ', attempt ' + reconnectAttempts + ')...');
      try {
        await new Promise(resolve => setTimeout(resolve, Math.min(1000 * reconnectAttempts, 5000)));
        if (!isRecording || generation !== streamGeneration) break;
        await connectKurdishSocket(generation);
        reconnectAttempts = 0;
        setError('');
        setStatus('Live Kurdish transcription resumed.');
        break;
      } catch(err) { console.warn('Kurdish stream reconnect failed:', err); }
    }
    if (isRecording && generation === streamGeneration && reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
      setError('Speech connection could not be restored. Stop & Save preserves the text already recognized.');
      setStatus('Transcription disconnected — Stop & Save to keep your text.');
    }
    reconnecting = false;
  }

  function joinSpeech(a, b) {
    a = String(a || '').trim(); b = String(b || '').trim();
    if (!a) return b;
    if (!b || a === b || a.endsWith(b)) return a;
    if (b.startsWith(a)) return b;
    const aw = a.split(/\s+/), bw = b.split(/\s+/);
    for (let n = Math.min(aw.length, bw.length); n > 0; n--) {
      if (aw.slice(-n).join(' ') === bw.slice(0,n).join(' '))
        return a + (n < bw.length ? ' ' + bw.slice(n).join(' ') : '');
    }
    return a + ' ' + b;
  }
  function renderPersistentTranscript() {
    const live = joinSpeech(committedSpeech, streamInterim);
    // Checkpoint only grows, except when a fresh recording explicitly resets it.
    if (live.length >= transcriptCheckpoint.length) transcriptCheckpoint = live;
    finalTranscript = committedSpeech;
    const box = document.getElementById('transcript');
    box.textContent = transcriptCheckpoint;
    box.style.height = 'auto';
    box.style.maxHeight = 'none';
  }
  function acceptKurdishMessage(msg) {
    if (typeof msg.text !== 'string') return;
    const text = msg.text.trim();
    if (msg.is_final) {
      // Some providers send a shortened final for the current window.
      const finalWindow = text || streamInterim || previousHypothesis;
      committedSpeech = joinSpeech(committedSpeech, finalWindow);
      streamInterim = '';
      previousHypothesis = '';
    } else if (text) {
      const old = previousHypothesis;
      // A sharp reduction or restart of the hypothesis indicates a new
      // recognition window. Commit the previous window before showing it.
      const reset = old && (
        (text.length < old.length * 0.75 && !old.startsWith(text)) ||
        (old.length > 45 && text.length < old.length * 0.5)
      );
      if (reset) committedSpeech = joinSpeech(committedSpeech, old);
      streamInterim = text;
      previousHypothesis = text;
      lastNonemptyInterim = text;
    } else {
      // Empty interim messages do not mean the user stopped speaking.
      // Keep the last hypothesis visible and available for saving.
    }
    lastMessageAt = Date.now();
    renderPersistentTranscript();
    queueLiveEnglishTranslation();
  }

  // AudioContext may run at the hardware rate (e.g. 48 kHz); downsample to 16 kHz.
  function pcm16At16k(input, inputRate) {
    const length = Math.floor(input.length * 16000 / inputRate);
    const out = new Int16Array(length);
    for (let i = 0; i < length; i++) {
      const start = Math.floor(i * inputRate / 16000);
      const end = Math.max(start + 1, Math.floor((i+1) * inputRate / 16000));
      let sum = 0;
      for (let j = start; j < Math.min(end,input.length); j++) sum += input[j];
      const sample = Math.max(-1, Math.min(1, sum / Math.max(1,Math.min(end,input.length)-start)));
      out[i] = sample < 0 ? sample * 32768 : sample * 32767;
    }
    return out.buffer;
  }

  async function stopStreamingAudio() {
    streamAudioActive = false;
    if (processor) { processor.onaudioprocess = null; processor.disconnect(); processor = null; }
    if (source) { source.disconnect(); source = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioContext) { await audioContext.close().catch(()=>{}); audioContext = null; }
  }

  async function startAnswer() {
    if (isRecording) return;
    const q = currentQuestion();
    if (!q) return;
    setError('');
    document.getElementById('saved').textContent = '';
    finalTranscript = '';
    streamFinalParts = []; streamInterim = '';
    lastNonemptyInterim = ''; transcriptCheckpoint = ''; committedSpeech = ''; previousHypothesis = '';
    renderPersistentTranscript();
    resetLiveEnglishTranslation('Waiting for Kurdish speech...');
    document.getElementById('startBtn').disabled = true;
    recordingQuestionId = q.id;
    try {
      if (!navigator.mediaDevices?.getUserMedia || !window.AudioContext)
        throw new Error('HTTPS and microphone support are required.');
      // Keep the microphone and audio graph running across provider reconnects.
      const generation = ++streamGeneration;
      reconnectAttempts = 0;
      reconnecting = false;
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioContext = new AudioContext();
      source = audioContext.createMediaStreamSource(mediaStream);
      processor = audioContext.createScriptProcessor(4096,1,1);
      streamingDone = new Promise(resolve => { streamingFinish = resolve; });
      await connectKurdishSocket(generation);
      processor.onaudioprocess = (event) => {
        if (streamAudioActive && ws && ws.readyState === WebSocket.OPEN) {
          try {
            if (ws.bufferedAmount < 512000) {
              ws.send(pcm16At16k(event.inputBuffer.getChannelData(0),audioContext.sampleRate));
              lastAudioSentAt = Date.now();
            }
          } catch(err) { reconnectKurdishSocket(streamGeneration, 'audio send failed'); }
        }
      };
      source.connect(processor); processor.connect(audioContext.destination);
      streamAudioActive = true; isRecording = true;
      lastAudioSentAt = Date.now();
      stopStreamWatchdog();
      streamWatchdog = setInterval(() => {
        if (!isRecording || reconnecting) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          reconnectKurdishSocket(streamGeneration, 'connection unavailable');
        } else if (Date.now() - lastMessageAt > STREAM_STALL_MS &&
                   Date.now() - lastAudioSentAt < STREAM_STALL_MS) {
          reconnectKurdishSocket(streamGeneration, 'no recognition messages');
        }
      }, STREAM_CHECK_MS);
      document.getElementById('stopBtn').disabled = false;
      setStatus('Live ' + KURDISH_DIALECT + ' transcription...');
    } catch(err) {
      setError(err.message || String(err));
      stopStreamWatchdog();
      await stopStreamingAudio();
      if(ws) {ws.close();ws=null;}
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }
  }

  // Convert MediaRecorder audio (WebM/MP4) to WAV accepted by KurdishTTS.
  async function convertRecordingToWav(blob) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    try {
      const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
      const rate = 16000;
      const frames = Math.ceil(decoded.duration * rate);
      const out = new ArrayBuffer(44 + frames * 2);
      const view = new DataView(out);
      const put = (at, str) => { for(let i=0;i<str.length;i++) view.setUint8(at+i,str.charCodeAt(i)); };
      put(0,'RIFF'); view.setUint32(4,36+frames*2,true); put(8,'WAVE');
      put(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
      view.setUint16(22,1,true); view.setUint32(24,rate,true);
      view.setUint32(28,rate*2,true); view.setUint16(32,2,true);
      view.setUint16(34,16,true); put(36,'data'); view.setUint32(40,frames*2,true);
      const channels = Array.from({length:decoded.numberOfChannels},(_,i)=>decoded.getChannelData(i));
      for(let i=0;i<frames;i++) {
        const x=i*decoded.sampleRate/rate, j=Math.floor(x), frac=x-j;
        let sample=0;
        for(const ch of channels) sample += ((ch[j]||0)*(1-frac)+(ch[j+1]||0)*frac);
        sample=Math.max(-1,Math.min(1,sample/channels.length));
        view.setInt16(44+i*2,Math.round(sample<0?sample*32768:sample*32767),true);
      }
      return new Blob([out],{type:'audio/wav'});
    } finally { await ctx.close(); }
  }

  async function uploadKurdishAudio(blob) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    let binary = '';
    // Chunk byte-to-base64 conversion to avoid call-stack overflow.
    for(let i=0;i<bytes.length;i+=8192)
      binary += String.fromCharCode(...bytes.subarray(i,i+8192));
    const encoded = btoa(binary);
    const uploadId = 'ku_' + crypto.randomUUID().replace(/-/g,'');
    const size = 6000; // divisible by four, safe for Apps Script GET limits
    const count = Math.ceil(encoded.length / size);
    if(count > 1500) throw new Error('Recording exceeds upload limit.');
    for(let i=0;i<count;i++) {
      setStatus('Uploading Kurdish audio: ' + (i+1) + '/' + count);
      await jsonpWithParams('uploadChunk', {
        uploadId, index:i, data:encoded.slice(i*size,(i+1)*size)
      }, {timeoutMs:30000});
    }
    return jsonpWithParams('transcribeKurdish', {uploadId,count,dialect:KURDISH_DIALECT},
      {timeoutMs:120000,timeoutMessage:'Kurdish transcription timed out.'});
  }

  function connectDeepgram(token, language) {
    return new Promise((resolve, reject) => {
      const lang = language || 'en-US';

      const params = new URLSearchParams({
        model: 'nova-3',
        language: lang,
        encoding: 'linear16',
        sample_rate: '16000',
        channels: '1',
        interim_results: 'true',
        punctuate: 'true',
        endpointing: '500'
      });

      const url = 'wss://api.deepgram.com/v1/listen?' + params.toString();

      // Browser WebSocket cannot set Authorization headers.
      // Deepgram supports the token through Sec-WebSocket-Protocol.
      ws = new WebSocket(url, ['bearer', token]);

      ws.onopen = () => {
        try {
          startAudioProcessing();
          resolve();
        } catch (err) {
          reject(err);
        }
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          const transcript =
            data.channel &&
            data.channel.alternatives &&
            data.channel.alternatives[0]
              ? data.channel.alternatives[0].transcript
              : '';

          if (!transcript) return;

          if (data.is_final) {
            finalTranscript +=
              (finalTranscript ? ' ' : '') + transcript;
            interimTranscript = '';

            // Translate only finalized Deepgram segments so the English
            // translation stays stable while still appearing near real time.
            queueLiveEnglishTranslation();
          } else {
            interimTranscript = transcript;
          }

          document.getElementById('transcript').textContent =
            finalTranscript +
            (interimTranscript
              ? (finalTranscript ? ' ' : '') + interimTranscript
              : '');
        } catch (err) {
          console.warn('Bad Deepgram message', err);
        }
      };

      ws.onerror = () => {
        reject(new Error('Deepgram WebSocket connection failed.'));
      };

      ws.onclose = (event) => {
        if (isRecording) {
          setError(
            'Deepgram connection closed. Code: ' +
            event.code
          );
        }
      };
    });
  }

  function startAudioProcessing() {
    if (!mediaStream) {
      throw new Error('Microphone stream is not available.');
    }

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    source = audioContext.createMediaStreamSource(mediaStream);

    // ScriptProcessorNode is widely supported in current browsers.
    processor = audioContext.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = function(event) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      const input = event.inputBuffer.getChannelData(0);
      const downsampled = downsampleBuffer(
        input,
        audioContext.sampleRate,
        16000
      );

      if (downsampled.length > 0) {
        const pcm = floatTo16BitPCM(downsampled);
        ws.send(pcm);
      }
    };

    source.connect(processor);
    processor.connect(audioContext.destination);
  }

  function downsampleBuffer(buffer, inputSampleRate, outputSampleRate) {
    if (outputSampleRate === inputSampleRate) {
      return buffer;
    }

    if (outputSampleRate > inputSampleRate) {
      throw new Error('Output sample rate cannot exceed input sample rate.');
    }

    const ratio = inputSampleRate / outputSampleRate;
    const newLength = Math.round(buffer.length / ratio);
    const result = new Float32Array(newLength);

    let offsetResult = 0;
    let offsetBuffer = 0;

    while (offsetResult < result.length) {
      const nextOffsetBuffer =
        Math.round((offsetResult + 1) * ratio);

      let accum = 0;
      let count = 0;

      for (
        let i = offsetBuffer;
        i < nextOffsetBuffer && i < buffer.length;
        i++
      ) {
        accum += buffer[i];
        count++;
      }

      result[offsetResult] = count ? accum / count : 0;
      offsetResult++;
      offsetBuffer = nextOffsetBuffer;
    }

    return result;
  }

  function floatTo16BitPCM(input) {
    const output = new Int16Array(input.length);

    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      output[i] = s < 0
        ? s * 0x8000
        : s * 0x7FFF;
    }

    return output.buffer;
  }

  async function stopAnswer() {
    if (!isRecording) return;
    isRecording = false;
    ++streamGeneration;
    stopStreamWatchdog();
    document.getElementById('stopBtn').disabled = true;
    setStatus('Finalizing Kurdish transcript...');
    try {
      await stopStreamingAudio();
      // The streaming service may not send a 'done' control message.
      // Preserve recognized text rather than discarding it on timeout.
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type:'control',event:'finalize'}));
      }
      const finalizationResult = await Promise.race([
        streamingDone,
        new Promise(resolve => setTimeout(() => resolve('timeout'), 8000))
      ]);
      if (finalizationResult === 'timeout') {
        console.warn('KurdishTTS did not acknowledge finalize; saving available transcript.');
      }
      // If finalization arrives without a final segment, retain the latest
      // visible hypothesis instead of dropping it or saving an empty answer.
      const answer = transcriptCheckpoint ||
        joinSpeech(committedSpeech, streamInterim || lastNonemptyInterim);
      if (!answer) throw new Error('No Kurdish speech recognized. Please retry or type the answer.');
      finalTranscript = answer;
      savedChoiceState.delete(String(recordingQuestionId));
      document.getElementById('transcript').textContent = answer;
      // Final translation is of the entire answer, not a concatenation of fragments.
      // Invalidate in-flight live translation responses before replacing the preview.
      translationGeneration++;
      translationPending = '';
      if (translationFlushTimer) clearTimeout(translationFlushTimer);
      translationFlushTimer = null;
      setStatus('Finalizing English translation...');
      let english = '';
      let translationWarning = '';
      try {
        const translated = await jsonpWithParams('translate',
          {text:answer,sourceLanguage:KURDISH_DIALECT === 'sorani' ? 'ckb' : 'kmr'},
          {timeoutMs:30000});
        english = String(translated.translation || '').trim();
        if (!english) translationWarning = 'English translation was empty.';
      } catch(translationError) {
        translationWarning = 'English translation unavailable: ' + translationError.message;
      }
      document.getElementById('liveEnglishTranslation').textContent =
        english || translationWarning;
      setStatus('Saving Sorani to respondent column and English to N...');
      const saveResult = await jsonpWithParams('saveBilingual', {
        id:recordingQuestionId, answer:answer, english:english,
        respondentSessionId:respondentSessionId
      }, {timeoutMs:45000});
      // Apps Script's final translation in N is authoritative.
      english = String(saveResult.translation || '').trim();
      if (english) document.getElementById('liveEnglishTranslation').textContent = english;
      if (saveResult.translationError) translationWarning = saveResult.translationError;
      const q = currentQuestion();
      if(q && q.id === recordingQuestionId && !String(q.closedAnswers||'').trim())
        renderAnswerBox(q,[answer]);
      document.getElementById('saved').textContent = english
        ? '✓ Sorani saved to respondent column; English saved to N'
        : '✓ Sorani saved; translation to column N unavailable';
      if (translationWarning) setError(translationWarning);
      setStatus('Answer saved');
    } catch(err) {
      setStatus('Transcription/save error');
      setError(err.message || String(err));
    } finally {
      stopStreamWatchdog();
      await stopStreamingAudio();
      if(ws) {ws.close();ws=null;}
      document.getElementById('startBtn').disabled = false;
      document.getElementById('nextBtn').disabled = false;
    }
  }

  function finalizeDeepgram() {
    return new Promise((resolve) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        resolve();
        return;
      }

      let done = false;
      const timer = setTimeout(finish, 1500);

      function finish() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve();
      }

      try {
        ws.send(JSON.stringify({ type: 'Finalize' }));
      } catch (e) {
        finish();
      }
    });
  }

  async function cleanupAudio() {
    try {
      if (processor) {
        processor.disconnect();
        processor.onaudioprocess = null;
      }

      if (source) {
        source.disconnect();
      }

      if (audioContext) {
        await audioContext.close();
      }
    } catch (e) {
      console.warn(e);
    }

    processor = null;
    source = null;
    audioContext = null;

    // IMPORTANT: keep mediaStream alive so the browser does not ask for
    // microphone permission again on the next question.
    // The microphone is stopped only when the interview page closes.

    if (ws) {
      try {
        if (ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING) {
          ws.close();
        }
      } catch (e) {
        console.warn(e);
      }
    }

    ws = null;
  }

  function clearAnswerCell(id) {
    return new Promise((resolve, reject) => {
      const callbackName =
        '__voiceClearCallback_' + Date.now() + '_' +
        Math.random().toString(36).slice(2);

      const script = document.createElement('script');

      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('Clear answer request timed out.'));
      }, 15000);

      window[callbackName] = function(data) {
        cleanup();

        if (!data || data.ok === false) {
          reject(new Error(data && data.error
            ? data.error
            : 'Could not clear the previous answer.'));
          return;
        }

        resolve(data);
      };

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      script.onerror = function() {
        cleanup();
        reject(new Error('Could not clear the previous answer from Apps Script.'));
      };

      const query = new URLSearchParams();
      query.set('action', 'clearAnswer');
      query.set('id', id);
      query.set('respondentSessionId', respondentSessionId);
      query.set('callback', callbackName);
      query.set('_', Date.now());

      script.src = BACKEND_URL + '?' + query.toString();
      document.head.appendChild(script);
    });
  }


  function saveAnswerAndRetrieveG(id, answer) {
    if (!id || !answer) {
      return Promise.reject(new Error('Missing question ID or answer.'));
    }

    // Save the answer and have Apps Script return the value from Column J (ODK Answer)
    // for the same question row after the save has completed.
    return jsonpWithParams('saveAndRetrieveG', {
      id: id,
      answer: answer,
      respondentSessionId: respondentSessionId
    }, {
      timeoutMs: 30000,
      timeoutMessage: 'Save and Response retrieval request timed out.'
    });
  }

  // Preserve the spoken response when closed-answer choices are saved.
  // A subsequent edit replaces only the previously appended choice lines,
  // avoiding duplicates and preserving the original Sorani transcript.
  const savedChoiceState = new Map();

  function answerWithSelectedChoices(question, selectedAnswer) {
    const id = String(question.id);
    const previous = savedChoiceState.get(id);
    const transcriptBox = document.getElementById('transcript');
    const displayed = String(transcriptBox.textContent || '').trim();
    const placeholder = 'Press Start Answer, speak Kurdish, then Stop & Save.';
    let base = previous && displayed === previous.combined
      ? previous.base
      : (displayed === placeholder ? '' : displayed);

    // One selected choice per line; preserve the existing #{...}# format.
    const choices = getSelectedCheckboxValues().map(value => '#{' + value + '}#');
    const combined = [base, ...choices].filter(Boolean).join('\n');
    return { base, combined };
  }

  async function saveEditableAnswer() {
    if (isRecording) return;

    const q = currentQuestion();
    if (!q) return;

    const isChoiceQuestion = Boolean(String(q.closedAnswers || '').trim());
    const choiceResult = isChoiceQuestion ? answerWithSelectedChoices(q) : null;
    const answer = isChoiceQuestion ? choiceResult.combined : getAnswerValueForSaving();

    if (!answer) {
      setStatus('Answer is empty');
      setError('Please enter an answer before clicking Save Answer.');
      return;
    }

    setError('');
    document.getElementById('saveAnswerBtn').disabled = true;
    setStatus('Saving edited answer...');

    try {
      const data = await saveEditableAnswerToSheet(q.id, answer);

      if (choiceResult) savedChoiceState.set(String(q.id), {
        base: choiceResult.base, combined: answer
      });
      document.getElementById('transcript').textContent = answer;
      document.getElementById('saved').textContent =
        '✓ Answer updated in Google Sheets';

      const columnNumber = Number(data.respondentColumn || 0);
      setStatus(columnNumber >= 16
        ? (currentQuestion().closedAnswers
            ? 'Selected responses saved — Respondent column updated'
            : 'Answer updated — Respondent column saved')
        : 'Answer updated');
    } catch (err) {
      setStatus('Save error');
      setError(err.message || String(err));
    } finally {
      document.getElementById('saveAnswerBtn').disabled = false;
    }
  }

  function saveEditableAnswerToSheet(id, answer) {
    return jsonpWithParams('save', {
      id: id,
      answer: answer,
      respondentSessionId: respondentSessionId
    }, {
      timeoutMs: 30000,
      timeoutMessage: 'Save Answer request timed out.'
    });
  }

  let movingToNextQuestion = false;

  function askFlag(q) {
    return String(q && q.ask != null ? q.ask : '').trim().toUpperCase();
  }

  function canNavigate(q, mandatoryOnly) {
    const flag = askFlag(q);
    return flag === 'TRUE' || (!mandatoryOnly && flag === 'MAY');
  }

  function navigateToIndex(index, message) {
    currentIndex = index;
    resetLiveEnglishTranslation('Waiting for transcription...');
    renderQuestion();
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    setStatus(message || 'Ready');
  }

  async function advanceEligible(mandatoryOnly) {
    if (isRecording) {
      setStatus('Stop & Save the current answer before moving to another question.');
      return;
    }
    if (movingToNextQuestion) return;
    movingToNextQuestion = true;
    const nextBtn = document.getElementById('nextBtn');
    const mandatoryBtn = document.getElementById('mandatoryBtn');
    nextBtn.disabled = true;
    mandatoryBtn.disabled = true;
    const currentId = currentQuestion() && currentQuestion().id;
    try {
      // Refresh formula-driven Ask flags so changing Column A is reflected.
      // If refresh fails, continue with the last successfully loaded values.
      try {
        const data = await jsonpWithParams('questions', {}, {
          timeoutMs: 12000,
          timeoutMessage: 'Question refresh timed out.'
        });
        if (Array.isArray(data.questions) && data.questions.length) {
          questions = data.questions;
        }
      } catch (err) {
        console.warn('Using cached question flags:', err);
      }
      const previous = questions.findIndex(q => q.id === currentId);
      const from = previous >= 0 ? previous : currentIndex;
      const next = questions.findIndex((q, i) => i > from && canNavigate(q, mandatoryOnly));
      if (next < 0) {
        setStatus(mandatoryOnly ? 'No further TRUE (mandatory) questions.' : 'No further MAY or TRUE questions.');
        return;
      }
      navigateToIndex(next, mandatoryOnly ? 'Mandatory question' : 'Next eligible question');
      updateJumpMatches();
    } finally {
      movingToNextQuestion = false;
      nextBtn.disabled = false;
      mandatoryBtn.disabled = false;
    }
  }

  function nextQuestion() { return advanceEligible(false); }
  function mandatoryQuestion() { return advanceEligible(true); }

  function wildcardRegex(term) {
    const special = '\\^$+?.()|[]{}';
    const escaped = Array.from(term).map(ch => {
      if (ch === '*') return '.*';
      if (ch === '?') return '.';
      return special.includes(ch) ? '\\' + ch : ch;
    }).join('');
    return new RegExp(escaped, 'i');
  }

  function matchingMandatoryQuestions() {
    const term = document.getElementById('jumpQuestionNumber').value.trim();
    if (!term) return [];
    let pattern;
    try { pattern = wildcardRegex(term); } catch (err) { return []; }
    return questions.map((q, index) => ({q, index}))
      .filter(item => canNavigate(item.q, true) &&
        pattern.test(String(item.q.englishQuestion || '')));
  }

  function updateJumpMatches() {
    const container = document.getElementById('jumpMatches');
    container.replaceChildren();
    const matches = matchingMandatoryQuestions();
    matches.slice(0, 40).forEach(item => {
      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('role', 'option');
      button.textContent = item.q.id + ' — ' + item.q.englishQuestion;
      button.onclick = () => selectJumpMatch(item.index);
      container.appendChild(button);
    });
    if (matches.length > 40) {
      const note = document.createElement('small');
      note.textContent = 'Showing first 40 of ' + matches.length + ' matches. Refine your search.';
      container.appendChild(note);
    }
  }

  function selectJumpMatch(index) {
    if (isRecording) {
      setStatus('Stop & Save before jumping to another question.');
      return;
    }
    if (!canNavigate(questions[index], true)) return;
    navigateToIndex(index, 'Jumped to ' + questions[index].id);
    document.getElementById('jumpQuestionNumber').value = questions[index].englishQuestion || '';
    document.getElementById('jumpMatches').replaceChildren();
  }

  function jumpToQuestion() {
    const matches = matchingMandatoryQuestions();
    if (!matches.length) {
      setStatus('No TRUE question matches the English question search.');
      return;
    }
    if (matches.length > 1) {
      setStatus('Select a question from the matching results.');
      updateJumpMatches();
      return;
    }
    selectJumpMatch(matches[0].index);
  }

  document.getElementById('jumpQuestionNumber').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      jumpToQuestion();
    }
  });

  function releaseMicrophone() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
  }

  window.addEventListener('beforeunload', function() {
    cleanupAudio();
    releaseMicrophone();
 

    if (questionAudioUrl) {
      URL.revokeObjectURL(questionAudioUrl);
      questionAudioUrl = null;
    }
  });

  loadQuestions();
</script>
